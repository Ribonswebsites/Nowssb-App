<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>AURA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#202731; --fg:#f2f4f7; --muted:#b3bdca; --subtle:#8793a2;
  --line:rgba(242,244,247,0.14); --row:rgba(255,255,255,0.05);
  --mini:rgba(255,255,255,0.06); --toggle-on:#f2f4f7; --toggle-off:rgba(255,255,255,0.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Outfit",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;touch-action:manipulation}
.phone{width:100%;max-width:430px;height:100%;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(16px);transition:opacity 280ms ease,transform 280ms ease}
.screen.active{opacity:1;pointer-events:auto;transform:translateX(0);z-index:2}

.top-bar{padding:calc(14px + env(safe-area-inset-top)) 16px 4px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;overflow:visible}
.top-bar .left,.top-bar .right{display:flex;align-items:center;gap:4px;min-width:48px;overflow:visible}
.top-bar .right{justify-content:flex-end;gap:8px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:var(--fg);cursor:pointer;padding:0;border-radius:50%;overflow:visible;flex-shrink:0}
.icon-btn:active{opacity:.55}
.icon-btn svg{width:22px;height:22px;overflow:visible;display:block}
.icon-btn.nav-back{width:44px;height:44px;background:#fff;color:#202731;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.icon-btn.nav-back svg{width:24px;height:24px}

/* CLOCK — the established AURA reference dial: compact, left-weighted, and clear of the settings rows */
.clock-stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0 0 4px;margin-top:-12px}
.clock-frame{position:relative;width:100%;max-width:390px;aspect-ratio:390/355;margin:0 auto;transform:translateY(-8%)}
.clock-svg{position:absolute;inset:0;width:100%;height:100%;color:var(--fg);overflow:visible}
.time-lockup{position:absolute;left:0;top:48%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;padding-left:86px;z-index:3}
.hour{font-size:68px;font-weight:200;letter-spacing:-0.02em;line-height:1;background:transparent;padding:0;border-radius:0;margin-right:-4px}
.minute-pill{display:flex;align-items:center;gap:8px;border:1px solid rgba(242,242,239,0.82);border-radius:999px;padding:6px 14px 6px 12px;background:transparent}
.minute{font-size:26px;font-weight:300;letter-spacing:0.04em}
.pill-div{width:1px;height:16px;background:rgba(242,242,239,0.62)}
.ampm{font-size:12px;font-weight:400;letter-spacing:0.12em;opacity:.9}
.date-lockup{position:absolute;right:10px;top:74%;transform:translateY(-50%);text-align:right;z-index:3;background:transparent;padding:0;border-radius:0}
.date-top{font-size:11px;letter-spacing:0.18em;font-weight:400}
.date-rule{width:170px;height:1px;background:rgba(242,242,239,0.52);margin:10px 0 10px auto}
.date-day{font-size:11px;letter-spacing:0.22em;font-weight:400}

/* Bottom settings — like reference, with icons */
.home-settings{padding:0 24px 0;flex-shrink:0}
.home-settings .kicker{background:none;border:0;color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;padding:0 0 8px;cursor:pointer;display:block;width:100%;text-align:left}
.home-rows{display:flex;flex-direction:column}
.home-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg)}
.home-row:last-child{border-bottom:none}
.home-row .row-icon{width:20px;height:20px;display:grid;place-items:center;flex-shrink:0;opacity:.9}
.home-row .row-icon svg{width:18px;height:18px}
.home-row .row-label{flex:1}
.home-row .val{color:var(--muted);display:flex;align-items:center;gap:4px;font-size:12px}
.home-row .val svg{opacity:.4;width:12px;height:12px}
.clock-battery{padding:10px 0 calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--subtle);flex-shrink:0}
.clock-number{fill:var(--fg);font-family:"Outfit",system-ui,sans-serif;font-weight:400}

/* LIBRARY */
.page-title{padding:8px 24px 4px;font-size:28px;font-weight:300;letter-spacing:0.28em;text-transform:uppercase}
.page-sub{padding:0 24px 18px;font-size:11px;font-weight:400;letter-spacing:0.22em;color:var(--muted);text-transform:uppercase}
.track-list{flex:1;overflow-y:auto;padding:0 16px 120px;-webkit-overflow-scrolling:touch}
.track-row{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:12px;cursor:pointer}
.track-row:active{background:var(--row)}
.track-art{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#161920;flex-shrink:0}
.track-meta{flex:1;min-width:0}
.track-title{font-size:15px;font-weight:400;letter-spacing:0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:11px;font-weight:400;letter-spacing:0.18em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.track-dur{font-size:13px;color:var(--subtle);font-weight:300;flex-shrink:0;padding-right:4px}

/* SETTINGS */
.settings-title{padding:18px 24px 34px;font-size:29px;font-weight:300;letter-spacing:0.27em;text-transform:uppercase;line-height:1.28}
.settings-list{flex:1;overflow-y:auto;padding:0 24px 130px;-webkit-overflow-scrolling:touch}
.set-row{display:flex;align-items:center;gap:16px;padding:16px 0;cursor:pointer;min-height:64px;border-bottom:1px solid var(--line)}
.set-row:active{background:var(--row);border-radius:10px}.set-row:last-child{border-bottom:0}
.set-icon{width:24px;height:24px;display:grid;place-items:center;color:var(--fg);flex-shrink:0;opacity:.9}
.set-icon svg{width:20px;height:20px}
.set-label{flex:1;font-size:13px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;line-height:1.25}
.set-value{font-size:12px;font-weight:400;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.set-value .chev{opacity:.45}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--toggle-off);position:relative;transition:background 200ms ease;flex-shrink:0;border:0;padding:0;cursor:pointer}
.toggle.on{background:var(--toggle-on)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#202731;transition:transform 200ms ease}
.toggle.on::after{transform:translateX(20px)}

/* MINI */
.mini{position:absolute;left:32px;right:32px;bottom:calc(20px + env(safe-area-inset-bottom));height:92px;background:rgba(255,255,255,.035);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;display:flex;align-items:center;gap:14px;padding:0 14px 0 12px;z-index:10;border:1px solid rgba(255,255,255,0.18)}
.mini.hidden{display:none}
.mini-art{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#161920;flex-shrink:0}
.mini-meta{flex:1;min-width:0}
.mini-title{font-size:13px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-artist{font-size:10px;font-weight:400;letter-spacing:0.24em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.mini-controls{display:flex;align-items:center;gap:2px;flex-shrink:0}
.mini-btn{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:var(--fg);cursor:pointer;padding:0}
.mini-btn.play{width:44px;height:44px}
.mini-btn:active{opacity:.55}
.battery{position:absolute;bottom:calc(4px + env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:var(--fg);z-index:5;pointer-events:none}
.battery.hidden{display:none}

.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.55);z-index:20;opacity:0;pointer-events:none;transition:opacity 220ms ease}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#14171e;border-radius:20px 20px 0 0;z-index:21;padding:12px 0 calc(24px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform 320ms cubic-bezier(0.32,0.72,0,1)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 16px}
.sheet-title{text-align:center;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sheet-opt{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;font-size:15px;letter-spacing:0.06em;cursor:pointer}
.sheet-opt:active{background:var(--row)}
.sheet-opt.selected{color:#fff}
.sheet-opt .check{opacity:0}
.sheet-opt.selected .check{opacity:1}
</style>
</head>
<body>
<div class="phone" id="app">

  <!-- CLOCK HOME -->
  <div class="screen active" id="screen-clock">
    <header class="top-bar">
      <div class="left">
        <button class="icon-btn nav-back" id="clk-back" aria-label="Back" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
        </button>
      </div>
      <div class="right">
        <button class="icon-btn" id="clk-lib" aria-label="Library" title="Library">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M17 15l4 2.5v-5L17 15z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="clk-settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>
    <div class="clock-stage">
      <div class="clock-frame">
        <svg class="clock-svg" viewBox="0 0 390 360" aria-hidden="true">
          <g id="ring-float"><g id="ring-outer"></g><g id="ring-inner"></g></g>
          <g id="clock-numbers"></g>
        </svg>
        <div class="time-lockup">
          <div class="hour" id="hour">00</div>
          <div class="minute-pill">
            <span class="minute" id="minute">00</span>
            <span class="pill-div"></span>
            <span class="ampm" id="ampm">AM</span>
          </div>
        </div>
        <div class="date-lockup">
          <div class="date-top" id="date-top">21 AUG 2026</div>
          <div class="date-rule"></div>
          <div class="date-day" id="date-day">FRIDAY</div>
        </div>
      </div>
    </div>
    <div class="home-settings">
      <button class="kicker" id="open-settings-from-clock">Music Player Settings</button>
      <div class="home-rows" id="home-rows"></div>
    </div>
    <div class="clock-battery">
      <svg width="12" height="18" viewBox="0 0 18 28"><rect x="4.2" y="2.2" width="9.6" height="23.4" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="6.8" y="0.4" width="4.4" height="2.2" rx="0.6" fill="currentColor"/><rect x="6.1" y="12.2" width="5.8" height="11.4" rx="0.8" fill="currentColor"/></svg>
      <span id="batt-clock">50%</span>
    </div>
  </div>

  <!-- LIBRARY -->
  <div class="screen" id="screen-library">
    <header class="top-bar">
      <div class="left">
        <button class="icon-btn" id="lib-back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H7"/><path d="m12 6-6 6 6 6"/></svg>
        </button>
      </div>
      <div class="right">
        <button class="icon-btn" id="lib-to-clock" aria-label="Clock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-btn" id="lib-settings" aria-label="Settings">

        </button>
      </div>
    </header>
    <div class="page-title">Library</div>
    <div class="page-sub">6 Tracks · Downloaded</div>
    <div class="track-list" id="track-list"></div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="screen-settings">
    <header class="top-bar">
      <div class="left">
        <button class="icon-btn" id="set-back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H7"/><path d="m12 6-6 6 6 6"/></svg>
        </button>
      </div>
      <div class="right"></div>
    </header>
    <div class="settings-title">Music Player<br>Settings</div>
    <div class="settings-list" id="settings-list"></div>
    <div class="battery" id="batt-set">
      <svg width="14" height="20" viewBox="0 0 18 28"><rect x="4" y="2" width="10" height="23" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="6.5" y="0.3" width="5" height="2.2" rx="0.5" fill="currentColor"/><rect x="6" y="12" width="6" height="11" rx="0.8" fill="currentColor"/></svg>
      <span id="batt-pct">50%</span>
    </div>
  </div>

  <!-- Mini player -->
  <div class="mini hidden" id="mini">
    <img class="mini-art" id="mini-art" alt="" />
    <div class="mini-meta">
      <div class="mini-title" id="mini-title">Dream State</div>
      <div class="mini-artist" id="mini-artist">Aurora</div>
    </div>
    <div class="mini-controls">
      <button class="mini-btn" id="btn-prev" aria-label="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button class="mini-btn play" id="btn-play" aria-label="Play">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" id="play-icon"><circle cx="12" cy="12" r="10"/><path d="M10 8.5v7l6-3.5-6-3.5z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="mini-btn" id="btn-next" aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
      </button>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">Option</div>
    <div id="sheet-options"></div>
  </div>
</div>

  dots:`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>`,
  chev:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5 16 12l-7 6.5"/></svg>`,
  check:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>`,
};

const AURA_PREF_KEY = "nwsb-aura-player-settings";
const state = {
  screen: "clock",
  current: 0,
  playing: false,
  settings: Object.fromEntries(SETTINGS_DEF.map(s => [s.key, s.value])),
};
try {
  const saved = JSON.parse(localStorage.getItem(AURA_PREF_KEY) || "null");
  if (saved && typeof saved === "object") Object.assign(state.settings, saved);
} catch (_) {}
function applyAURASettings() {
  const speed = {"0.5x":0.5,"0.75x":0.75,"Normal":1,"1.25x":1.25,"1.5x":1.5,"2x":2}[state.settings.speed] || 1;
  window._pwSpeed = speed;
  window._pwAURAEq = state.settings.eq;
  window._pwAURABass = !!state.settings.bass;
  window._pwAURACrossfade = state.settings.crossfade;
  window._pwAURASleep = state.settings.sleep;
  window._pwAURADownloadOnly = !!state.settings.download;
  window._pwAURAPlaylist = state.settings.playlist;
  window._pwAURANowPlaying = state.settings.nowplaying;
}
function persistAURASettings() {
  try { localStorage.setItem(AURA_PREF_KEY, JSON.stringify(state.settings)); } catch (_) {}
  applyAURASettings();
}
applyAURASettings();

function showScreen(name) {
  state.screen = name;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const el = document.getElementById("screen-" + name);
  if (el) el.classList.add("active");
  const mini = document.getElementById("mini");
  const batt = document.getElementById("batt-set");
  if (name === "clock") {
    mini.classList.add("hidden");
  } else {
    mini.classList.remove("hidden");
  }
  if (name === "settings") batt.classList.remove("hidden");
  else batt.classList.add("hidden");
}

/* Clock */
const CX=176, CY=186;
function polar(rad,deg){const a=(deg*Math.PI)/180;return{x:+(CX+rad*Math.cos(a)).toFixed(1),y:+(CY+rad*Math.sin(a)).toFixed(1)};}
function buildArc(count,startDeg,spanDeg,radius,everyMajor,everyMid,lenMajor,lenMid,lenMin){
  const lines=[];
  // Number guard zones — ticks stop before hitting labels
  const numZones = [
    {x:40,y:184,r:22},{x:58,y:56,r:16},{x:148,y:28,r:16},
    {x:108,y:88,r:15},{x:300,y:72,r:16},{x:176,y:268,r:16},
    {x:72,y:238,r:16},{x:268,y:308,r:15},{x:136,y:348,r:16},{x:44,y:308,r:15},
  ];
  for(let i=0;i<count;i++){
    const t=count===1?0:i/(count-1);
    const deg=startDeg+t*spanDeg;
    const major=i%everyMajor===0;
    const mid=!major&&i%everyMid===0;
    const len=major?lenMajor:mid?lenMid:lenMin;
    const bump=major?2.2:mid?0.6:0;
    const p1=polar(radius+bump,deg),p2=polar(radius-len,deg);
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    // Invisible barrier: no ticks through hour + minute pill
    if(mx>78&&mx<268&&my>138&&my<238)continue;
    // Invisible barrier: no ticks through date
    if(mx>275&&my>145&&my<245)continue;
    // Invisible barrier: no ticks through number labels
    let hitNum=false;
    for(const z of numZones){
      const dx=mx-z.x, dy=my-z.y;
      if(dx*dx+dy*dy < z.r*z.r){hitNum=true;break;}
    }
    if(hitNum)continue;
    const w=major?1.5:1.15,o=major?0.95:mid?0.72:0.42;
    lines.push(`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="currentColor" stroke-width="${w}" stroke-linecap="butt" opacity="${o}"/>`);
  }
  return lines.join("");
}
function initClock(){
  // Dense C-arcs; ticks skip time/date/numbers via barriers above
  document.getElementById("ring-outer").innerHTML=buildArc(72,48,285,152,6,3,18,11,6);
  document.getElementById("ring-inner").innerHTML=buildArc(48,62,255,96,6,2,12,7,4.5);
  // Numbers offset off the tick path (padding from arcs)
  const nums=[
    {n:"60",x:36,y:184,s:22},
    {n:"55",x:54,y:52,s:15},
    {n:"50",x:148,y:24,s:16},
    {n:"45",x:104,y:84,s:14},
    {n:"40",x:304,y:68,s:16},
    {n:"35",x:176,y:268,s:14},
    {n:"30",x:72,y:238,s:15},
    {n:"25",x:272,y:308,s:14},
    {n:"20",x:136,y:348,s:14},
    {n:"15",x:40,y:308,s:14},
  ];
  document.getElementById("clock-numbers").innerHTML=nums.map(n=>
    `<text x="${n.x}" y="${n.y}" text-anchor="middle" dominant-baseline="middle" class="clock-number" font-size="${n.s}">${n.n}</text>`
  ).join("");
}
function startRingSpin(){
  const outer=document.getElementById("ring-outer");
  const inner=document.getElementById("ring-inner");
  const floatG=document.getElementById("ring-float");
  if(!outer||!inner)return;
  const OUTER_DPS=360/32, INNER_DPS=-360/22, OX=176, OY=186;
  let angleO=0,angleI=0,t0=performance.now(),last=t0,rafId=0,running=true;
  function frame(now){
    if(!running)return;
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    const elapsed=(now-t0)/1000;
    angleO=(angleO+OUTER_DPS*dt)%360;
    angleI=(angleI+INNER_DPS*dt)%360;
    const fy=Math.sin(elapsed*0.55)*2.4;
    const fx=Math.sin(elapsed*0.37+1.2)*1.3;
    floatG.setAttribute("transform",`translate(${fx.toFixed(2)} ${fy.toFixed(2)})`);
    outer.setAttribute("transform",`rotate(${angleO.toFixed(2)} ${OX} ${OY})`);
    inner.setAttribute("transform",`rotate(${angleI.toFixed(2)} ${OX} ${OY})`);
    rafId=requestAnimationFrame(frame);
  }
  rafId=requestAnimationFrame(frame);
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){running=false;cancelAnimationFrame(rafId);}
    else{running=true;last=performance.now();rafId=requestAnimationFrame(frame);}
  });
}
const MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DAYS=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
function tickTime(){
  const now=new Date();
  const h24=now.getHours(),am=h24<12,h12=h24%12||12;
  document.getElementById("hour").textContent=String(h12).padStart(2,"0");
  document.getElementById("minute").textContent=String(now.getMinutes()).padStart(2,"0");
  document.getElementById("ampm").textContent=am?"AM":"PM";
  document.getElementById("date-top").textContent=`${String(now.getDate()).padStart(2,"0")} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById("date-day").textContent=DAYS[now.getDay()];
}
function renderHomeRows(){
  const el=document.getElementById("home-rows");
  el.innerHTML=HOME_ROWS.map(r=>{
    const v=state.settings[r.key]??"";
    const icon=ICONS[r.icon]||"";
    return `<div class="home-row">
      <span class="row-icon">${icon}</span>
      <span class="row-label">${r.label}</span>
      <span class="val">${v} ${ICONS.chev}</span>
    </div>`;
  }).join("");
}

/* Library */
function renderLibrary(){
  const list=document.getElementById("track-list");
  list.innerHTML=TRACKS.map((t,i)=>`
    <div class="track-row ${i===state.current?"active":""}" data-i="${i}">
      <img class="track-art" src="${ART[t.artKey]}" alt="" />
      <div class="track-meta">
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <div class="track-dur">${t.dur}</div>
    </div>`).join("");
  list.querySelectorAll(".track-row").forEach(row=>{
    row.addEventListener("click",()=>{
      state.current=+row.dataset.i;
      state.playing=true;
      updateMini();
      renderLibrary();
      startTone();
    });
  });
}

/* Settings */
function renderSettings(){
  const list=document.getElementById("settings-list");
  list.innerHTML=SETTINGS_DEF.map(s=>{
    const val=state.settings[s.key];
    if(s.type==="toggle"){
      return `<div class="set-row" data-key="${s.key}" data-type="toggle">
        <div class="set-icon">${ICONS[s.icon]}</div>
        <div class="set-label">${s.label}</div>
        <button class="toggle ${val?"on":""}" data-key="${s.key}"></button>
      </div>`;
    }
    const display=val==null?"":val;
    return `<div class="set-row" data-key="${s.key}" data-type="nav">
      <div class="set-icon">${ICONS[s.icon]}</div>
      <div class="set-label">${s.label}</div>
      <div class="set-value">${display?`<span>${display}</span>`:""}<span class="chev">${ICONS.chev}</span></div>
    </div>`;
  }).join("");
  list.querySelectorAll(".set-row").forEach(row=>{
    const key=row.dataset.key, type=row.dataset.type;
    if(type==="toggle"){
      const btn=row.querySelector(".toggle");
      const flip=()=>{state.settings[key]=!state.settings[key];persistAURASettings();renderSettings();renderHomeRows();};
      btn.addEventListener("click",e=>{e.stopPropagation();flip();});
      row.addEventListener("click",flip);
    } else {
      row.addEventListener("click",()=>openSheet(key));
    }
  });
}

function openSheet(key){
  const def=SETTINGS_DEF.find(s=>s.key===key);
  if(!def||!def.options)return;
  document.getElementById("sheet-title").textContent=def.label;
  const opts=document.getElementById("sheet-options");
  const cur=state.settings[key];
  opts.innerHTML=def.options.map(o=>`
    <div class="sheet-opt ${o===cur?"selected":""}" data-val="${o}">
      <span>${o}</span><span class="check">${ICONS.check}</span>
    </div>`).join("");
  opts.querySelectorAll(".sheet-opt").forEach(el=>{
    el.addEventListener("click",()=>{
      state.settings[key]=el.dataset.val;
      persistAURASettings();
      closeSheet();renderSettings();renderHomeRows();
    });
  });
  document.getElementById("sheet-backdrop").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){
  document.getElementById("sheet-backdrop").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
}
document.getElementById("sheet-backdrop").addEventListener("click",closeSheet);

function updateMini(){
  const t=TRACKS[state.current];
  document.getElementById("mini-art").src=ART[t.artKey];
  document.getElementById("mini-title").textContent=t.title;
  document.getElementById("mini-artist").textContent=t.artist;
  const icon=document.getElementById("play-icon");
  if(state.playing){
    icon.innerHTML=`<circle cx="12" cy="12" r="10"/><rect x="9" y="8" width="2.2" height="8" rx="0.5" fill="currentColor" stroke="none"/><rect x="12.8" y="8" width="2.2" height="8" rx="0.5" fill="currentColor" stroke="none"/>`;
  } else {
    icon.innerHTML=`<circle cx="12" cy="12" r="10"/><path d="M10 8.5v7l6-3.5-6-3.5z" fill="currentColor" stroke="none"/>`;
  }
}

document.getElementById("btn-play").addEventListener("click",()=>{
  state.playing=!state.playing;updateMini();
  if(state.playing)startTone();else stopTone();
});
document.getElementById("btn-prev").addEventListener("click",()=>{
  state.current=(state.current-1+TRACKS.length)%TRACKS.length;
  updateMini();renderLibrary();if(state.playing)startTone();
});
document.getElementById("btn-next").addEventListener("click",()=>{
  state.current=(state.current+1)%TRACKS.length;
  updateMini();renderLibrary();if(state.playing)startTone();
});

/* Nav */
let prevScreen = "clock";
const _showScreen = showScreen;
showScreen = function (name) {
  if (state.screen !== name) prevScreen = state.screen;
  _showScreen(name);
};
document.getElementById("clk-back").addEventListener("click", () => {
  /* Prefer the existing Player document in WebView history. This restores the
     live Player without a Home/splash restart. The query marker is only for a
     direct standalone visit where there is no prior app document. */
  try { sessionStorage.setItem("nwsb_return_to_player", JSON.stringify({ts:Date.now()})); } catch (e) {}
  const fromPlayer = new URLSearchParams(location.search).get('from') === 'player';
  if (fromPlayer) location.replace('index.html?returnTo=player');
  else if (window.history.length > 1) window.history.back();
  else location.assign("index.html?returnTo=player");
});
document.getElementById("clk-lib").addEventListener("click", () => showScreen("library"));
document.getElementById("clk-settings").addEventListener("click", () => showScreen("settings"));
document.getElementById("open-settings-from-clock").addEventListener("click", () => showScreen("settings"));
/* The reference flow reveals the flat settings page with an upward swipe from
   the clock, while preserving the explicit Music Player Settings button. */
let clockSwipeY = null;
const clockScreen = document.getElementById("screen-clock");
clockScreen.addEventListener("touchstart", (e) => {
  clockSwipeY = e.touches && e.touches[0] ? e.touches[0].clientY : null;
}, {passive:true});
clockScreen.addEventListener("touchend", (e) => {
  if (clockSwipeY == null) return;
  const endY = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : clockSwipeY;
  if (clockSwipeY - endY > 56) showScreen("settings");
  clockSwipeY = null;
}, {passive:true});
document.getElementById("lib-back").addEventListener("click", () => showScreen("clock"));
document.getElementById("lib-to-clock").addEventListener("click", () => showScreen("clock"));
document.getElementById("lib-settings").addEventListener("click", () => showScreen("settings"));
document.getElementById("set-back").addEventListener("click", () => {
  showScreen(prevScreen === "settings" ? "clock" : prevScreen);
});

let audioCtx=null,oscNodes=[];
function startTone(){
  stopTone();
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const master=audioCtx.createGain();master.gain.value=0.04;master.connect(audioCtx.destination);
    const freqs=[110,164.8,220,329.6];
    oscNodes=freqs.map((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=i%2?"sine":"triangle";o.frequency.value=f;g.gain.value=0.15/(i+1);
      o.connect(g);g.connect(master);o.start();return o;
    });
  }catch(_){}
}
function stopTone(){oscNodes.forEach(o=>{try{o.stop()}catch(_){}});oscNodes=[];}

/* Boot */
initClock();
startRingSpin();
tickTime();
setInterval(tickTime,1000);
renderHomeRows();
renderLibrary();
renderSettings();
persistAURASettings();
updateMini();
const bootScreen = (location.hash || "").replace("#","");
showScreen(["clock","library","settings"].includes(bootScreen) ? bootScreen : "clock");

if(navigator.getBattery){
  navigator.getBattery().then(b=>{
    const pct=Math.round(b.level*100)+"%";
    document.getElementById("batt-pct").textContent=pct;
    document.getElementById("batt-clock").textContent=pct;
  }).catch(()=>{});
}
</script>
