<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Mode - Neumorphic White</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #eceff4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }

  .wrapper {
    width: 100%;
    max-width: 400px;
    background: #eceff4;
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      10px 10px 22px rgba(163, 170, 189, 0.55),
      -10px -10px 22px rgba(255, 255, 255, 0.9);
  }

  /* ---- Heading row above the card ---- */
  .heading-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    padding: 0 4px;
  }

  .heading-text {
    font-size: 17px;
    font-weight: 600;
    color: #2b2f3a;
    letter-spacing: 0.2px;
  }

  .section-divider {
    height: 1px;
    background: rgba(43, 47, 58, 0.12);
    margin: 4px 4px 18px;
  }

  /* ---- Neumorphic card ---- */
  .card {
    background: transparent;
    border-radius: 24px;
    padding: 4px 2px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  /* shared neumorphic circle, used for heading icon, card icon and enter button */
  .neu-circle {
    flex: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #eceff4;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      6px 6px 12px rgba(163, 170, 189, 0.55),
      -6px -6px 12px rgba(255, 255, 255, 0.9);
    transition: box-shadow 0.15s ease;
    border: none;
  }

  .neu-circle:active {
    box-shadow:
      inset 4px 4px 8px rgba(163, 170, 189, 0.55),
      inset -4px -4px 8px rgba(255, 255, 255, 0.9);
  }

  .neu-circle.small {
    width: 44px;
    height: 44px;
  }

  .divider {
    width: 1px;
    height: 34px;
    background: rgba(43, 47, 58, 0.14);
    flex: none;
  }

  .text-block {
    min-width: 0;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #8b8f9d;
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .title {
    font-size: 20px;
    font-weight: 600;
    color: #2b2f3a;
    margin-bottom: 3px;
  }

  .subtitle {
    font-size: 12px;
    color: #9297a5;
    letter-spacing: 0.3px;
  }

  .enter-btn {
    cursor: pointer;
    outline: none;
  }

  /* ---- Horizontal scrollable small boxes ---- */
  .scroll-section {
    margin-top: 4px;
    margin-left: -10px;
    margin-right: -10px;
    display: flex;
    gap: 14px;
    overflow-x: auto;
    overflow-y: visible;
    padding: 10px 10px 14px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .scroll-section::-webkit-scrollbar {
    display: none;
  }

  .mini-box {
    flex: none;
    width: 84px;
    height: 84px;
    border-radius: 18px;
    background: #eceff4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow:
      5px 5px 10px rgba(163, 170, 189, 0.45),
      -5px -5px 10px rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: box-shadow 0.15s ease;
  }

  .mini-box:active {
    box-shadow:
      inset 3px 3px 6px rgba(163, 170, 189, 0.45),
      inset -3px -3px 6px rgba(255, 255, 255, 0.7);
  }

  .mini-box svg {
    display: block;
  }

  .mini-box span {
    font-size: 10.5px;
    font-weight: 600;
    color: #6b7080;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>

  <div class="wrapper">

    <!-- Heading above the card: circle + svg, heading text -->
    <div class="heading-row">
      <div class="neu-circle small">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3z"/>
          <path d="M19 15l0.9 2.1L22 18l-2.1 0.9L19 21l-0.9-2.1L16 18l2.1-0.9L19 15z"/>
        </svg>
      </div>
      <div class="heading-text">Discover the experience</div>
    </div>

    <div class="section-divider"></div>

    <!-- Card -->
    <div class="card">
      <div class="left">
        <div class="neu-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l3 2 3-2 3 2 3-2v5l-2 2 2 2v9H6v-9l2-2-2-2z"/>
            <path d="M9 8h6"/>
          </svg>
        </div>

        <div class="divider"></div>

        <div class="text-block">
          <div class="eyebrow">Experience</div>
          <div class="title">Fashion mode</div>
          <div class="subtitle">Dark &middot; Cinematic &middot; Editorial</div>
        </div>
      </div>

      <button class="neu-circle enter-btn" aria-label="Enter fashion mode">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>

    <!-- Horizontal scrollable small boxes -->
    <div class="scroll-section">

      <div class="mini-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1 3-6z"/>
        </svg>
        <span>New</span>
      </div>

      <div class="mini-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3"/>
        </svg>
        <span>Recent</span>
      </div>

      <div class="mini-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z"/>
          <path d="M4 9h16M9 4v16"/>
        </svg>
        <span>Grid</span>
      </div>

      <div class="mini-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21c0-4-3.6-7-8-7s-8 3-8 7"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Style</span>
      </div>

      <div class="mini-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12l7-9v5h11l-7 9v-5H3z"/>
        </svg>
        <span>Trending</span>
      </div>

      <div class="mini-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21c-4-3-8-6.5-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4.5-4 8-8 11z"/>
        </svg>
        <span>Saved</span>
      </div>

    </div>

  </div>

</body>
</html>
