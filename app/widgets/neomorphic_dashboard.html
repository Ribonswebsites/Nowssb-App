<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — Neomorphic</title>
<style>
  :root{
    --bg:#f5f5f5;
    --bg-alt:#fafafa;
    --text-dark:#1c1c1c;
    --text-mid:#767676;
    --text-light:#a8a8a8;
    --accent-purple:#6d5bd0;
    --accent-purple-soft:#a79ae8;
    --shadow-dark:#d9d9d9;
    --shadow-light:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    padding:0;
  }

  /* ---------- Neomorphic helpers ---------- */
  .neo-raised{
    background:var(--bg);
    box-shadow:
      8px 8px 16px var(--shadow-dark),
      -8px -8px 16px var(--shadow-light);
  }
  .neo-inset{
    background:var(--bg);
    box-shadow:
      inset 5px 5px 10px var(--shadow-dark),
      inset -5px -5px 10px var(--shadow-light);
  }
  .neo-pill-dark{
    background:linear-gradient(145deg,#333a4a,#232833);
    box-shadow:
      6px 6px 14px #b9bfc9,
      -6px -6px 14px #ffffff;
  }

  /* ---------- Today's focus ---------- */
  .focus-card{
    border-radius:28px;
    padding:22px 22px 24px;
    position:relative;
    overflow:hidden;
    margin-bottom:26px;
  }
  .focus-label{
    font-size:13px;
    color:var(--text-mid);
    margin-bottom:10px;
  }
  .focus-title{
    font-size:26px;
    font-weight:700;
    color:var(--text-dark);
    line-height:1.2;
    max-width:70%;
    margin-bottom:16px;
  }
  .focus-meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--text-mid);
    margin-bottom:20px;
  }
  .focus-meta .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent-purple-soft);
    display:inline-block;
  }
  .focus-meta .bold{
    color:var(--text-dark);
    font-weight:600;
  }
  .blob-wrap{
    position:absolute;
    right:14px;
    top:18px;
    width:130px;
    height:130px;
  }
  .start-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:13px 22px;
    border-radius:18px;
    color:#f3f0ff;
    font-size:14px;
    font-weight:600;
    border:none;
    cursor:pointer;
  }
  .start-btn svg{width:16px;height:16px;}

  /* ---------- Section headers ---------- */
  .section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .section-header h2{
    font-size:17px;
    font-weight:700;
    color:var(--text-dark);
  }
  .view-all{
    font-size:13px;
    color:var(--text-mid);
    display:flex;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }

  /* ---------- Progress ---------- */
  .progress-card{
    border-radius:24px;
    padding:20px 6px;
    margin-bottom:28px;
    display:flex;
  }
  .progress-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:0 6px;
    position:relative;
  }
  .progress-item + .progress-item::before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    height:38px;
    width:1px;
    background:var(--shadow-dark);
    opacity:.6;
  }
  .icon-circle-wrap{
    width:52px;
    height:52px;
    margin-bottom:10px;
    border-radius:50%;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
      6px 6px 12px var(--shadow-dark),
      -6px -6px 12px var(--shadow-light);
  }
  .icon-circle-wrap svg{
    width:52px;
    height:52px;
  }
  .progress-value{
    font-size:19px;
    font-weight:700;
    color:var(--text-dark);
    margin-bottom:3px;
  }
  .progress-label{
    font-size:11.5px;
    color:var(--text-mid);
    margin-bottom:6px;
  }
  .progress-delta{
    font-size:11.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:2px;
  }

  /* ---------- Up next ---------- */
  .upnext-card{
    border-radius:24px;
    padding:8px 16px;
  }
  .upnext-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    position:relative;
    cursor:pointer;
  }
  .upnext-row + .upnext-row{
    border-top:1px solid var(--shadow-dark);
  }
  .icon-circle-wrap-sm{
    width:44px;
    height:44px;
    flex-shrink:0;
    border-radius:50%;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
      5px 5px 10px var(--shadow-dark),
      -5px -5px 10px var(--shadow-light);
  }
  .icon-circle-wrap-sm svg{
    width:44px;
    height:44px;
  }
  .icon-divider{
    width:1px;
    align-self:stretch;
    margin:6px 0;
    background:var(--shadow-dark);
    opacity:.6;
    flex-shrink:0;
  }
  .upnext-text{flex:1;}
  .upnext-title{
    font-size:15px;
    font-weight:600;
    color:var(--text-dark);
    margin-bottom:2px;
  }
  .upnext-sub{
    font-size:12.5px;
    color:var(--text-mid);
  }
  .status-soon{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--text-mid);
  }
  .status-dot{
    width:16px;height:16px;
    border-radius:50%;
    border:2px solid var(--text-light);
  }
  .chevron{
    color:var(--text-light);
  }
</style>
</head>
<body>

  <!-- Today's focus -->
  <div class="focus-card neo-raised">
    <div class="focus-label">Today's focus</div>
    <div class="focus-title">Deep work session</div>
    <div class="focus-meta">
      <span class="dot"></span><span class="bold">2h 0m</span>
      <span class="dot"></span><span>High priority</span>
    </div>
    <button class="start-btn neo-pill-dark" data-dashboard-action="practice">
      Start session
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>

    <div class="blob-wrap">
      <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blobGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c9c2f0"/>
            <stop offset="100%" stop-color="#e7e2fb"/>
          </linearGradient>
          <linearGradient id="blobGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c6ae0"/>
            <stop offset="100%" stop-color="#9384e8"/>
          </linearGradient>
        </defs>
        <path fill="url(#blobGrad1)" d="M20,55 C10,80 30,105 60,100 C90,95 100,70 90,45 C80,20 50,10 30,25 C15,35 25,40 20,55 Z"/>
        <circle cx="88" cy="38" r="26" fill="url(#blobGrad2)"/>
      </svg>
    </div>
  </div>

  <!-- Your progress -->
  <div class="section-header">
    <h2>Your progress</h2>
    <div class="view-all" role="button" tabindex="0" data-dashboard-action="practice">View all
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>

  <div class="progress-card neo-raised">

    <div class="progress-item">
      <div class="icon-circle-wrap">
        <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 27 L23 33 L35 20" fill="none" stroke="#3ba55d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="progress-value">12</div>
      <div class="progress-label">Tasks done</div>
      <div class="progress-delta" style="color:#3ba55d;">+20% ↑</div>
    </div>

    <div class="progress-item">
      <div class="icon-circle-wrap">
        <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="26" r="9" fill="none" stroke="#8a8a8a" stroke-width="2.4"/>
          <path d="M26 20 L26 26 L30 29" fill="none" stroke="#8a8a8a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="progress-value">8h 45m</div>
      <div class="progress-label">Focused time</div>
      <div class="progress-delta" style="color:#767676;">+15% ↑</div>
    </div>

    <div class="progress-item">
      <div class="icon-circle-wrap">
        <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <path d="M26 15 C29 21 33 23 33 29 C33 34.5 29.9 38 26 38 C22.1 38 19 34.5 19 29 C19 26 20.5 24.5 21.5 27 C22 23 24 20 26 15 Z" fill="#e78a3e"/>
        </svg>
      </div>
      <div class="progress-value">5</div>
      <div class="progress-label">Day streak</div>
      <div class="progress-delta" style="color:#e78a3e;">+1 ↑</div>
    </div>

    <div class="progress-item">
      <div class="icon-circle-wrap">
        <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="26" r="9" fill="none" stroke="#8a6fe0" stroke-width="2.2"/>
          <circle cx="26" cy="26" r="4.5" fill="none" stroke="#8a6fe0" stroke-width="2.2"/>
          <circle cx="26" cy="26" r="1.3" fill="#8a6fe0"/>
        </svg>
      </div>
      <div class="progress-value">78%</div>
      <div class="progress-label">Goal progress</div>
      <div class="progress-delta" style="color:#8a6fe0;">+8% ↑</div>
    </div>

  </div>

  <!-- Up next -->
  <div class="section-header" style="margin-top:26px;">
    <h2>Up next</h2>
    <div class="view-all" role="button" tabindex="0" data-dashboard-action="practice">View all
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>

  <div class="upnext-card neo-raised">

    <div class="upnext-row" role="button" tabindex="0" data-dashboard-action="practice">
      <div class="icon-circle-wrap-sm">
        <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
          <rect x="14" y="14" width="16" height="14" rx="2.5" fill="none" stroke="#e78a3e" stroke-width="1.8"/>
          <line x1="14" y1="19" x2="30" y2="19" stroke="#e78a3e" stroke-width="1.8"/>
          <line x1="18" y1="12" x2="18" y2="16" stroke="#e78a3e" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="26" y1="12" x2="26" y2="16" stroke="#e78a3e" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="icon-divider"></div>
      <div class="upnext-text">
        <div class="upnext-title">Team stand-up</div>
        <div class="upnext-sub">10:00 AM · 30 min</div>
      </div>
      <div class="status-soon">
        <span class="status-dot"></span>Soon
      </div>
    </div>

    <div class="upnext-row" role="button" tabindex="0" data-dashboard-action="practice">
      <div class="icon-circle-wrap-sm">
        <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
          <rect x="15" y="12" width="14" height="18" rx="2" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
          <line x1="18" y1="18" x2="26" y2="18" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="18" y1="22" x2="26" y2="22" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="18" y1="26" x2="23" y2="26" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="icon-divider"></div>
      <div class="upnext-text">
        <div class="upnext-title">Design review</div>
        <div class="upnext-sub">2:00 PM · 1h 0m</div>
      </div>
      <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

  </div>

<script>
  function dashboardAction(action) {
    window.parent.postMessage({ type: 'nowssb-dashboard-action', action: action }, window.location.origin);
  }
  document.querySelectorAll('[data-dashboard-action]').forEach(function(control) {
    control.addEventListener('click', function() { dashboardAction(control.dataset.dashboardAction); });
    control.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        dashboardAction(control.dataset.dashboardAction);
      }
    });
  });
</script>
</body>
</html>
