<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Essentials — Neumorphic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg: #eceef2;
    --shadow-light: #ffffff;
    --shadow-dark: #c7cdd9;
    --text-main: #2b2d33;
    --text-sub: #8a8f9a;
    --orange-1: #ffb44d;
    --orange-2: #ff8a3d;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    padding: 0;
  }
  .body{ padding: 26px 22px 30px; }

  h2.section-title{
    font-size: 21px;
    font-weight: 700;
    color: var(--text-main);
    margin: 0 0 18px 4px;
  }

  .timeline{ display:flex; flex-direction: column; }
  .row{ display:flex; gap: 16px; align-items: stretch; }
  .track{ display:flex; flex-direction:column; align-items:center; width: 22px; flex-shrink:0; }
  .dot{
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--bg);
    margin-top: 26px;
    box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    position: relative; z-index:2;
  }
  .dot.active{
    background: linear-gradient(145deg, var(--orange-1), var(--orange-2));
    box-shadow: 3px 3px 6px var(--shadow-dark), -2px -2px 6px var(--shadow-light), 0 0 0 4px rgba(255,138,61,0.15);
  }
  .connector{
    flex:1; width: 3px;
    background-image: linear-gradient(var(--shadow-dark) 40%, rgba(0,0,0,0) 0%);
    background-size: 3px 10px;
    background-repeat: repeat-y;
    margin: 2px 0;
    min-height: 22px;
  }
  .card-wrap{ flex:1; padding-bottom: 18px; }

  .hero-card{
    position: relative;
    border-radius: 26px;
    padding: 22px 24px;
    background: linear-gradient(135deg, var(--orange-1), var(--orange-2));
    box-shadow: 9px 9px 18px var(--shadow-dark), -9px -9px 18px var(--shadow-light), inset 0 1px 1px rgba(255,255,255,0.35);
    overflow: hidden;
    min-height: 148px;
  }
  .hero-card .face{ position:absolute; right: 18px; bottom: 14px; width: 70px; height: 70px; opacity: 0.9; }
  .badge-row{ display:flex; align-items:center; gap:8px; margin-bottom: 14px; }
  .badge{
    display:flex; align-items:center; gap: 4px;
    background: rgba(255,255,255,0.55);
    border-radius: 20px; padding: 4px 10px 4px 6px;
    font-weight:700; font-size: 13px; color: #6b3f13;
  }
  .badge .rings{ display:flex; }
  .ring{ width:14px; height:14px; border-radius:50%; margin-left:-5px; border: 2px solid rgba(255,255,255,0.7); }
  .ring:first-child{ margin-left:0; }
  .badge .rings .r1{ background:#c98bea; }
  .badge .rings .r2{ background:#ffd15c; }
  .badge .rings .r3{ background:#61d095; }
  .more-btn{
    margin-left:auto; width: 30px; height:30px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    display:flex;align-items:center;justify-content:center;
    color:#6b3f13; font-weight:800;
  }
  .hero-card .title{
    display:flex; align-items:center; gap:8px;
    font-size: 20px; font-weight: 800; color: #4a2a09;
    margin: 4px 0 10px;
  }
  .hero-card .meta{
    display:flex; align-items:center; gap:6px;
    color:#5c3812; font-weight:600; font-size: 14.5px; margin-bottom: 2px;
  }
  .hero-card .duration{ color:#5c3812; font-weight:700; font-size: 14.5px; margin-left: 22px; }

  .pill{
    display:flex; align-items:center; gap: 14px;
    background: var(--bg);
    border-radius: 20px; padding: 14px 18px;
    box-shadow: 7px 7px 14px var(--shadow-dark), -7px -7px 14px var(--shadow-light);
  }
  .icon-group{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-circle{
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--bg);
    box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
    display:flex; align-items:center; justify-content:center;
    color: #9aa0ab;
    flex-shrink:0;
  }
  .pill-text{ display:flex; flex-direction:column; gap:3px; }
  .pill-title{ color: var(--text-main); font-weight: 700; font-size: 16px; }
  .pill-duration{ color: var(--text-sub); font-weight: 500; font-size: 14px; }

  .see-more{
    display:inline-flex; align-items:center; gap:10px;
    margin: 4px 0 6px 38px;
    padding: 10px 16px 10px 20px;
    border-radius: 22px;
    background: var(--bg);
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    color: var(--text-sub); font-weight: 700; font-size: 14.5px;
    cursor: pointer; user-select:none;
    width: fit-content;
  }
  .see-more .arrow-circle{
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--bg);
    box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .see-more svg{ width:13px; height:13px; transition: transform .3s ease; color: var(--text-sub); }
  .see-more.open .arrow-circle svg{ transform: rotate(180deg); }
  #extra-track{ display:none; }
  #extra-track.show{ display:flex; flex-direction:column; }
  .new-pill{ animation: rise .45s ease both; }
  @keyframes rise{ from{ opacity:0; transform: translateY(12px); } to{ opacity:1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="body">
    <h2 class="section-title">Your essentials</h2>

    <div class="timeline">
      <div class="row">
        <div class="track">
          <div class="dot active"></div>
          <div class="connector"></div>
        </div>
        <div class="card-wrap">
          <div class="hero-card">
            <div class="badge-row">
              <div class="badge">
                <span class="rings"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span></span>
                543
              </div>
              <div class="more-btn">•••</div>
            </div>
            <div class="title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#4a2a09"><path d="M12 17a2 2 0 0 0 2-2v-3a2 2 0 0 0-4 0v3a2 2 0 0 0 2 2zm6-5v3a6 6 0 0 1-12 0v-3H4v3a8 8 0 0 0 7 7.94V22h2v-2.06A8 8 0 0 0 20 12v-3z"/></svg>
              Preconceptions
            </div>
            <div class="meta">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M11 5 6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              Today's Meditation
            </div>
            <div class="duration">3–20 min</div>
            <svg class="face" viewBox="0 0 100 100"><path d="M25 55 Q35 65 45 55" stroke="#4a2a09" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M55 55 Q65 65 75 55" stroke="#4a2a09" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="track">
          <div class="dot"></div>
          <div class="connector"></div>
        </div>
        <div class="card-wrap">
          <div class="pill">
            <div class="icon-group">
              <div class="icon-circle">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>
              </div>
              <div class="icon-circle">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13a3 3 0 1 0-2-5"/><path d="M3 17h9a3 3 0 1 1-2 5"/></svg>
              </div>
            </div>
            <div class="pill-text">
              <div class="pill-title">Wind down for bed</div>
              <div class="pill-duration">12 min</div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="track">
          <div class="dot"></div>
          <div class="connector"></div>
        </div>
        <div class="card-wrap">
          <div class="pill">
            <div class="icon-group">
              <div class="icon-circle">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>
              </div>
              <div class="icon-circle">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              </div>
            </div>
            <div class="pill-text">
              <div class="pill-title">Fall asleep</div>
              <div class="pill-duration">45 min</div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="track">
          <div class="dot" id="last-dot"></div>
          <div class="connector" id="tail-connector" style="display:none;"></div>
        </div>
        <div class="card-wrap">
          <div class="pill">
            <div class="icon-group">
              <div class="icon-circle">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>
              </div>
              <div class="icon-circle">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:-6px;margin-top:-14px;"><path d="M12 2l1.4 3.6L17 7l-3.6 1.4L12 12l-1.4-3.6L7 7l3.6-1.4z"/></svg>
              </div>
            </div>
            <div class="pill-text">
              <div class="pill-title">Sleep through the night</div>
              <div class="pill-duration">45–480 min</div>
            </div>
          </div>
        </div>
      </div>

      <div id="extra-track">
        <div class="row">
          <div class="track">
            <div class="dot"></div>
            <div class="connector"></div>
          </div>
          <div class="card-wrap">
            <div class="pill new-pill">
              <div class="icon-group">
                <div class="icon-circle">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>
                </div>
                <div class="icon-circle">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                </div>
              </div>
              <div class="pill-text">
                <div class="pill-title">Wake up gently</div>
                <div class="pill-duration">8 min</div>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="track">
            <div class="dot"></div>
          </div>
          <div class="card-wrap">
            <div class="pill new-pill" style="animation-delay:.08s;">
              <div class="icon-group">
                <div class="icon-circle">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>
                </div>
                <div class="icon-circle">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10M7 8l5-5 5 5"/><path d="M4 21h16"/></svg>
                </div>
              </div>
              <div class="pill-text">
                <div class="pill-title">Morning intention</div>
                <div class="pill-duration">5 min</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="see-more" id="see-more-btn" onclick="toggleMore()">
      <span id="see-more-label">See more</span>
      <div class="arrow-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
</div>

<script>
  function toggleMore(){
    const extra = document.getElementById('extra-track');
    const btn = document.getElementById('see-more-btn');
    const label = document.getElementById('see-more-label');
    const tail = document.getElementById('tail-connector');
    const open = extra.classList.toggle('show');
    tail.style.display = open ? 'block' : 'none';
    btn.classList.toggle('open', open);
    label.textContent = open ? 'See less' : 'See more';
    window.parent.postMessage({ type: 'nowssb-essentials-resize' }, window.location.origin);
  }
</script>

</body>
</html>
