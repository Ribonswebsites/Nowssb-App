<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help & Support</title>
<style>
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --card-border: rgba(255,255,255,0.08);
    --circle: #ffffff;
    --text-primary: #ffffff;
    --text-secondary: #9a9a9e;
    --chevron: #6e6e73;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 0;
  }

  .screen {
    width: 100%;
    max-width: 400px;
    padding: 0 18px;
  }

  .back-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--circle);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 18px;
  }

  .back-btn svg {
    width: 17px;
    height: 17px;
    stroke: #000000;
  }

  h1.title {
    font-size: 30px;
    font-weight: 800;
    color: var(--text-primary);
    margin: 0 0 16px 0;
    letter-spacing: -0.4px;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }

  .search-bar svg {
    width: 17px;
    height: 17px;
    stroke: var(--text-secondary);
    flex-shrink: 0;
  }

  .search-bar span {
    color: var(--text-secondary);
    font-size: 14px;
  }

  .option-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
  }

  .icon-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--circle);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .option-icon {
    width: 17px;
    height: 17px;
    stroke: #000000;
  }

  .vline {
    width: 1px;
    align-self: stretch;
    background: rgba(255,255,255,0.15);
    flex-shrink: 0;
  }

  .option-text {
    flex: 1;
    min-width: 0;
  }

  .option-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .option-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .chevron-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--circle);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .option-chevron {
    width: 14px;
    height: 14px;
    stroke: #000000;
    flex-shrink: 0;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.12);
    margin: 4px 0 20px 0;
  }

  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .footer .help-icon-circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--circle);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .footer .help-icon {
    width: 17px;
    height: 17px;
    stroke: #000000;
  }

  .footer .footer-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .contact-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 14px;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 700;
    padding: 13px;
    cursor: pointer;
  }

  .contact-btn .arrow-circle {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--circle);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .contact-btn svg {
    width: 12px;
    height: 12px;
    stroke: #000000;
  }
</style>
</head>
<body>
  <div class="screen">

    <button class="back-btn" aria-label="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <h1 class="title">Help &amp; Support</h1>

    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.3-4.3"/>
      </svg>
      <span>Search for help...</span>
    </div>

    <div class="option-list">

      <div class="option-card">
        <div class="icon-circle">
          <svg class="option-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6c-1.5-1.4-3.6-2-6.5-2A3.5 3.5 0 0 0 2 7.5v11A2.5 2.5 0 0 1 4.5 17c2.5 0 4.9.6 6.3 1.9M12 6c1.5-1.4 3.6-2 6.5-2A3.5 3.5 0 0 1 22 7.5v11a2.5 2.5 0 0 0-2.5-1.5c-2.5 0-4.9.6-6.3 1.9M12 6v13"/>
          </svg>
        </div>
        <div class="vline"></div>
        <div class="option-text">
          <div class="option-title">Help Center</div>
          <div class="option-subtitle">Find answers &amp; guides</div>
        </div>
        <div class="chevron-circle">
          <svg class="option-chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>

      <div class="option-card">
        <div class="icon-circle">
          <svg class="option-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
          </svg>
        </div>
        <div class="vline"></div>
        <div class="option-text">
          <div class="option-title">Contact Support</div>
          <div class="option-subtitle">Get help from our team</div>
        </div>
        <div class="chevron-circle">
          <svg class="option-chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>

      <div class="option-card">
        <div class="icon-circle">
          <svg class="option-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L1 21h22L12 2z"/>
            <path d="M12 9v5M12 17.5h.01"/>
          </svg>
        </div>
        <div class="vline"></div>
        <div class="option-text">
          <div class="option-title">Report a Problem</div>
          <div class="option-subtitle">Tell us what went wrong</div>
        </div>
        <div class="chevron-circle">
          <svg class="option-chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>

      <div class="option-card">
        <div class="icon-circle">
          <svg class="option-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            <path d="M12 8.5c-1-1-3-1-3 .7 0 1.7 3 3.3 3 3.3s3-1.6 3-3.3c0-1.7-2-1.7-3-.7z"/>
          </svg>
        </div>
        <div class="vline"></div>
        <div class="option-text">
          <div class="option-title">Send Feedback</div>
          <div class="option-subtitle">Help us improve</div>
        </div>
        <div class="chevron-circle">
          <svg class="option-chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <div class="footer">
      <div class="help-icon-circle">
        <svg class="help-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4M12 17.5h.01"/>
        </svg>
      </div>
      <div class="footer-text">Still need help?</div>
      <button class="contact-btn">
        Contact Support
        <div class="arrow-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </button>
    </div>

  </div>
</body>
</html>
