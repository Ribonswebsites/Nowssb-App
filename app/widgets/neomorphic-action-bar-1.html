<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neomorphic action bar</title>
<style>
  :root {
    --bg: #e8edf4;
    --surface: #f4f8fc;
    --shadow-dark: rgba(163, 177, 198, 0.55);
    --shadow-light: rgba(255, 255, 255, 0.9);
    --text-primary: #2e3a59;
    --text-secondary: #6b7a99;
    --accent: #7b88ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif; padding: 0; }
  .card { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 24px; }
  .header-row { display: flex; align-items: center; gap: 14px; }
  .heading { margin: 0; font-size: 20px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.2px; }
  .neo-circle { flex-shrink: 0; width: 48px; height: 48px; background: var(--surface); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); }
  .neo-circle svg { width: 21px; height: 21px; }
  .header-icon { color: var(--accent); }
  .action-wrapper { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border-radius: 999px; padding: 8px; box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light); }
  .icons-group { display: flex; flex-direction: row; align-items: center; gap: 8px; }
  .icon-btn { border: none; cursor: pointer; padding: 0; color: var(--text-secondary); }
  .neo-circle.sm { width: 40px; height: 40px; color: var(--text-secondary); transition: box-shadow 0.15s ease, transform 0.15s ease; }
  .neo-circle.sm svg { width: 18px; height: 18px; }
  .icon-btn:active { box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light); transform: scale(0.94); }
  .enter-btn { display: flex; align-items: center; justify-content: center; gap: 6px; border: none; cursor: pointer; background: var(--surface); color: var(--text-primary); font-family: inherit; font-size: 15px; font-weight: 700; padding: 13px 22px; border-radius: 999px; white-space: nowrap; box-shadow: 5px 5px 11px var(--shadow-dark), -5px -5px 11px var(--shadow-light); transition: box-shadow 0.15s ease, transform 0.15s ease; }
  .enter-btn svg { width: 16px; height: 16px; }
  .enter-btn:active { box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light); transform: scale(0.96); }
  .icon-btn:focus-visible, .enter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <div class="neo-circle header-icon">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 3c.4 3.6 1 5.2 2.4 6.6C15.8 11 17.4 11.6 21 12c-3.6.4-5.2 1-6.6 2.4C13 15.8 12.4 17.4 12 21c-.4-3.6-1-5.2-2.4-6.6C8.2 13 6.6 12.4 3 12c3.6-.4 5.2-1 6.6-2.4C11 8.2 11.6 6.6 12 3z"/></svg>
      </div>
      <h1 class="heading">How can we help today?</h1>
    </div>
    <div class="action-wrapper">
      <div class="icons-group">
        <button class="neo-circle sm icon-btn" type="button" data-actionbar-action="support" aria-label="Help and support">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 13v-1a8 8 0 0 1 16 0v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="13" width="4" height="6" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="17" y="13" width="4" height="6" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M19 19v1a2 2 0 0 1-2 2h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="neo-circle sm icon-btn" type="button" data-actionbar-action="coach" aria-label="Personal coach">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9.5" cy="7.5" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M4 19c0-3.3 2.5-5.6 5.5-5.6s5.5 2.3 5.5 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15 11l4-4m0 0h-3m3 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="enter-btn" type="button" data-actionbar-action="support">Enter <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h13m0 0l-5-5m5 5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</body>
</html>
