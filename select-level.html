<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Select Level</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#f4f4f6;
  }
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }

  .card{
    width:100%;max-width:420px;
    border-radius:34px;
    padding:24px 22px 30px;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,0.05), transparent 55%),
      #030303;
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:
      0 40px 90px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.05);
    position:relative;
    overflow:hidden;
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom: 14px;
  }
  .circle-btn{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    color:#eee;
    cursor:pointer;
  }
  .circle-btn svg{ width:17px; height:17px; }

  /* ---- ring artwork (looping orb video) ---- */
  .orb-wrap{
    display:flex;align-items:center;justify-content:center;
    padding: 4px 0 10px;
  }
  .orb-wrap video,
  .orb-wrap img{
    width: 220px; height:220px;
    object-fit: cover;
    display:block;
    border-radius: 50%;
    filter: drop-shadow(0 0 40px rgba(255,255,255,0.08));
    background: #000;
  }

  .select-label{
    display:flex;align-items:center;justify-content:center;gap:12px;
    margin: 4px 0 24px;
    color: rgba(255,255,255,0.55);
    font-size: 12.5px;
    letter-spacing: 4px;
    font-weight:500;
  }
  .select-label .line{
    height:1px; width:44px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35));
  }
  .select-label .line.right{ background: linear-gradient(90deg, rgba(255,255,255,0.35), transparent); }
  .select-label .dot{ width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.5); }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  /* ---- glass level buttons w/ shine sweep + specular edge ---- */
  .level-btn{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px;
    border-radius: 999px;
    background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015) 55%, rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    cursor:pointer;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    transition: border-color .25s ease, transform .15s ease, box-shadow .25s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), inset 0 -1px 6px rgba(0,0,0,0.4), 0 8px 18px rgba(0,0,0,0.4);
    animation: rowIn .5s ease both;
  }
  @keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .level-btn::before{
    /* diagonal specular streak, like glass catching light */
    content:"";
    position:absolute; inset:-40% -20%;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.16) 48%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0.16) 52%, transparent 60%);
    transform: translateX(-60%);
    transition: transform 1.1s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
    z-index:1;
  }
  .level-btn:hover::before{ transform: translateX(60%); }
  .level-btn:active{ transform: scale(0.97); }
  .level-btn.selected{
    border-color: rgba(255,255,255,0.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 0 0 1px rgba(255,255,255,0.14), 0 0 26px rgba(255,255,255,0.22);
  }

  .level-text{ position:relative; z-index:2; }
  .level-text .num{
    font-size: 26px;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 5px;
    letter-spacing: -0.01em;
  }
  .level-text .label{
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.45);
    font-weight: 500;
  }

  .radio{
    width: 30px; height:30px; border-radius:50%;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    position:relative; z-index:2;
  }
  .radio .dot{
    width:7px;height:7px;border-radius:50%;
    background: rgba(255,255,255,0.35);
    transition: box-shadow .25s ease, background .25s ease;
  }
  .level-btn.selected .radio{ border-color: rgba(255,255,255,0.6); }
  .level-btn.selected .radio .dot{
    background:#fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.9);
  }

  .expand-btn,.prev-btn{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 20px;
    border-radius: 999px;
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    cursor:pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 18px rgba(0,0,0,0.35);
  }
  .expand-left{
    display:flex; align-items:center; gap:14px;
    font-size: 12px; letter-spacing: 3px; font-weight:500;
    color: #f0f0f0;
  }
  .expand-left svg{ width:18px; height:18px; opacity:0.85; }
  .expand-btn .chev{ width:18px; height:18px; opacity:0.7; transition: transform .3s ease; }
  .expand-btn.open .chev{ transform: rotate(180deg); }

  .prev-btn{
    margin-top: 12px;
    justify-content: center;
    gap: 10px;
    font-size: 12px; letter-spacing: 3px; font-weight:500; color:#f0f0f0;
  }
  .prev-btn svg{ width:16px; height:16px; opacity:0.8; }

  .hidden-block{ display:none; }

  @media (max-width:380px){
    .orb-wrap video,.orb-wrap img{ width:185px; height:185px; }
    .level-text .num{ font-size:22px; }
    .grid{ gap:10px; }
    .level-btn{ padding:14px 15px; }
  }
</style>
</head>
<body>

<div class="card">

  <div class="topbar">
    <button class="circle-btn" id="selectLevelBack" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <div class="circle-btn" aria-label="More">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </div>
  </div>

  <div class="orb-wrap">
    <video class="orb-video" src="assets/video/orb-loop.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto" aria-label="NowssB level ring"></video>
  </div>

  <div class="select-label">
    <span class="line"></span>
    <span>SELECT LEVEL</span>
    <span class="line right"></span>
  </div>

  <div class="grid" id="levelGrid"></div>

  <div class="expand-btn" id="expandBtn">
    <div class="expand-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/>
      </svg>
      <span>EXPAND OPTIONS</span>
    </div>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </div>

  <div class="prev-btn hidden-block" id="prevBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    <span>PREVIOUS LEVELS</span>
  </div>

</div>

<script>
  document.getElementById('selectLevelBack').addEventListener('click',()=>{ if(window.parent!==window){window.parent.postMessage({type:'close-player-sheet'},'*');} else {location.replace('index.html?returnTo=player');} });
  const allLevels = [
    {num:"01", label:"LEVEL ONE"},
    {num:"02", label:"LEVEL TWO"},
    {num:"03", label:"LEVEL THREE"},
    {num:"04", label:"LEVEL FOUR"},
    {num:"05", label:"LEVEL FIVE"},
    {num:"06", label:"LEVEL SIX"},
    {num:"07", label:"LEVEL SEVEN"},
    {num:"08", label:"LEVEL EIGHT"},
    {num:"09", label:"LEVEL NINE"},
    {num:"10", label:"LEVEL TEN"},
  ];

  const grid = document.getElementById('levelGrid');
  const expandBtn = document.getElementById('expandBtn');
  const prevBtn = document.getElementById('prevBtn');
  let selectedIndex = null;
  let expanded = false;

  function renderGrid(list){
    grid.innerHTML = list.map((l,i)=>`
      <div class="level-btn ${selectedIndex===i?'selected':''}" data-index="${i}" style="animation-delay:${i*0.04}s">
        <div class="level-text">
          <div class="num">${l.num}</div>
          <div class="label">${l.label}</div>
        </div>
        <div class="radio"><div class="dot"></div></div>
      </div>
    `).join('');
  }

  renderGrid(allLevels.slice(0,6));

  grid.addEventListener('click', (e)=>{
    const btn = e.target.closest('.level-btn');
    if(!btn) return;
    selectedIndex = parseInt(btn.dataset.index);
    grid.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  });

  expandBtn.addEventListener('click', ()=>{
    expanded = true;
    expandBtn.classList.add('open');
    renderGrid(allLevels); // levels 1 - 10
    expandBtn.classList.add('hidden-block');
    prevBtn.classList.remove('hidden-block');
  });

  prevBtn.addEventListener('click', ()=>{
    expanded = false;
    expandBtn.classList.remove('open');
    renderGrid(allLevels.slice(0,6));
    expandBtn.classList.remove('hidden-block');
    prevBtn.classList.add('hidden-block');
  });
</script>
</body>
</html>
