name: Apply NowssB Practice Lab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  practice-ui:
    if: "!contains(github.event.head_commit.message, '[practice-ui]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Practice Lab UI
        env:
          PRACTICE_OVERLAY_B64: "