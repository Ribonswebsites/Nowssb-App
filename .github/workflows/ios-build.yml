# Builds the iOS app from this repo on a macOS runner.
#
# What this can and cannot do, plainly: it compiles the app and proves the iOS
# project is sound, but it builds WITHOUT code signing. An .ipa that TestFlight
# or the App Store will accept has to be signed with your Apple Developer
# certificate and provisioning profile, and those cannot be generated here —
# they are issued to your account. Once they are in this repo's secrets the
# archive step below can be pointed at them.
#
# So: this catches a broken iOS build on every push. It does not yet hand you
# something installable on a phone. That last step needs the Apple account.

name: iOS build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    name: Compile (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the web bundle
        run: npm run build:native

      - name: Create the iOS project
        run: npx cap add ios

      - name: Sync
        run: npx cap sync ios

      - name: Install pods
        working-directory: ios/App
        run: pod install

      - name: Build
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Collect the app
        working-directory: ios/App
        run: |
          mkdir -p out
          cp -R build/Build/Products/Release-iphoneos/App.app out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: nowssb-ios-app-unsigned
          path: ios/App/out
          if-no-files-found: warn
