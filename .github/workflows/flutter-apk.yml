# Builds the Flutter APK and hands it back as a download.
#
# This is the one that gets you a file to upload. flutter_app/android and
# flutter_app/ios are generated, not committed, so
# `flutter create --platforms=ios,android .`
# recreates it on the runner before building. Nothing has to be installed on
# your machine: push, open the Actions tab, download the APK from the run's Artifacts.

name: Flutter APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: flutter_app

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bundle the clips and the shipped content
        working-directory: .
        run: node tools/flutter-assets.mjs

      - name: Stamp installable package version
        working-directory: .
        env:
          NWSB_BUILD_NUMBER: ${{ github.run_number }}
        run: node tools/flutter-version.mjs

      - name: Apply Practice Lab UI
        working-directory: .
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path

          root = Path('flutter_app')
          payload_file = Path('tools/practice_overlay.gz.b64')
          overlay_file = root / 'lib/screens/practice_overlay.dart'
          if not overlay_file.exists():
              if not payload_file.exists():
                  raise SystemExit('Practice Lab payload is missing')
              overlay_file.write_bytes(gzip.decompress(base64.b64decode(payload_file.read_text().strip())))

          player = root / 'lib/screens/practice_player.dart'
          text = player.read_text()

          imp = "import 'practice_overlay.dart';\n"
          anchor = "import 'player_dial.dart';\n"
          if imp not in text:
              if anchor not in text:
                  raise SystemExit('Practice Lab import anchor not found')
              text = text.replace(anchor, anchor + imp, 1)

          old = '                        onPractice: _prepareAndPlay,'
          if old in text:
              text = text.replace(old, '                        onPractice: _openPracticeLab,', 1)

          method = '''  void _openPracticeLab() {
    showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      backgroundColor: Colors.transparent,
      barrierColor: Colors.black.withOpacity(.76),
      builder: (_) => PracticeLabSheet(
        word: _word,
        accent: _theme.accent,
        onSpeak: _prepareAndPlay,
        onClose: () => Navigator.of(context).pop(),
      ),
    );
  }

'''
          marker = '  void _openSettings() {'
          if '_openPracticeLab()' not in text:
              if marker not in text:
                  raise SystemExit('Practice Lab insertion marker not found')
              text = text.replace(marker, method + marker, 1)

          player.write_text(text)
          PY

      - name: Format
        run: dart format lib/screens/practice_player.dart lib/screens/practice_overlay.dart

      - name: Create the Android and iOS projects
        run: flutter create --platforms=ios,android --org com.nowssb --project-name nowssb .

      - name: Configure the Android project
        working-directory: .
        run: node tools/flutter-android.mjs

      - name: Install shared iOS branding
        working-directory: .
        run: node tools/flutter-ios.mjs

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build
        run: flutter build apk --debug --dart-define=NWSB_BUILD_NUMBER=${{ github.run_number }}

      - name: Commit verified Practice Lab UI
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/screens/practice_player.dart flutter_app/lib/screens/practice_overlay.dart
          if [ -f tools/practice_overlay.gz.b64 ]; then git rm tools/practice_overlay.gz.b64; fi
          if git diff --cached --quiet; then
            echo "No Practice Lab changes to commit."
            exit 0
          fi
          git commit -m "Add glassmorphism Practice Lab"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: nowssb-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish direct Flutter APK and update manifest
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=nowssb-flutter-android
          FILE=flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          PUBLIC_FILE=NowssB-Flutter-Android.apk
          UPDATE_FILE=NowssB-Flutter-update.json
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "NowssB Flutter Android" --notes "Latest direct NowssB Flutter Android APK."
          fi
          cp "$FILE" "$PUBLIC_FILE"
          cat > "$UPDATE_FILE" <<EOF
          {"channel":"flutter-android","build":${GITHUB_RUN_NUMBER},"websiteUrl":"https://ribonswebsites.github.io/Nowssb-App/","apkUrl":"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PUBLIC_FILE}"}
          EOF
          gh release upload "$TAG" "$PUBLIC_FILE" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" "$UPDATE_FILE" --repo "$GITHUB_REPOSITORY" --clobber

  release-bundle:
    name: Signed release bundle (Play)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check the signing secrets are set
        id: guard
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set — skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle the clips and the shipped content
        if: steps.guard.outputs.ok == 'true'
        working-directory: .
        run: node tools/flutter-assets.mjs

      - name: Create the Android and iOS projects
        if: steps.guard.outputs.ok == 'true'
        run: flutter create --platforms=ios,android --org com.nowssb --project-name nowssb .

      - name: Configure the Android project
        if: steps.guard.outputs.ok == 'true'
        working-directory: .
        run: node tools/flutter-android.mjs

      - name: Install shared iOS branding
        if: steps.guard.outputs.ok == 'true'
        working-directory: .
        run: node tools/flutter-ios.mjs

      - name: Write the signing material
        if: steps.guard.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/nowssb.keystore
          cat > android/key.properties <<EOF
          storeFile=nowssb.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Dependencies
        if: steps.guard.outputs.ok == 'true'
        run: flutter pub get

      - name: Build
        if: steps.guard.outputs.ok == 'true'
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          name: nowssb-flutter-release-aab
          path: flutter_app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
