# Builds the Flutter APK and hands it back as a download.
#
# This is the one that gets you a file to upload. flutter_app/android and
# flutter_app/ios are generated, not committed, so
# `flutter create --platforms=ios,android .`
# recreates it on the runner before building. Nothing has to be installed on
# your machine: push, open the Actions tab, download the APK from the run's
# Artifacts.
#
# The debug APK installs on any phone with "install unknown apps" enabled —
# use it to see the app working. Play needs the signed release bundle, which
# is the second job; it runs on demand and only when the keystore is in this
# repository's secrets, because a release build cannot be signed without one.

name: Flutter APK

# No `paths:` filter. There was one — flutter_app/** — and the workflow was
# registered but never fired on the push that added it, while android-apk.yml,
# which has no such filter, ran from the same kind of push minutes earlier.
# Rather than keep guessing at the filter, it runs on every push to main. A
# few spare runner minutes is a cheaper problem than a build you cannot get.
#
# IT ALSO BUILDS THE WORK BRANCHES. Only building main meant every APK
# installed for review was main's — so a whole session's work could be
# written, pushed and reviewed against a build that did not contain any of
# it. That is not a slow feedback loop, it is a wrong one: the screenshots
# coming back were of code that had already been deleted.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

# Keep only the newest APK build for each branch so stale runs do not occupy
# the GitHub-hosted runner queue indefinitely.
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: flutter_app

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The clips are in this repository once, at assets/video/. This copies
      # them into the Flutter bundle and writes the shipped content JSON.
      # It has to run BEFORE pub get: pubspec.yaml declares assets/video/ and
      # a declared asset directory that does not exist fails pub get outright.
      - name: Bundle the clips and the shipped content
        working-directory: .
        run: node tools/flutter-assets.mjs

      - name: Stamp installable package version
        working-directory: .
        env:
          NWSB_BUILD_NUMBER: ${{ github.run_number }}
        run: node tools/flutter-version.mjs

      # The Practice Lab UI is committed in lib/. This only checks that
      # tools/apply_practice_lab.py has nothing left to apply; CI never
      # commits or pushes to main.
      - name: Check Practice Lab UI is applied
        working-directory: .
        run: |
          python3 tools/apply_practice_lab.py
          if ! git diff --quiet -- flutter_app/lib/screens/practice_player.dart flutter_app/lib/screens/practice_overlay.dart; then
            git diff --stat -- flutter_app/lib/screens/
            echo "::error::tools/apply_practice_lab.py still changes practice_player.dart / practice_overlay.dart. Run it locally and commit the result."
            exit 1
          fi

      # android/ and ios/ are generated. This writes them without touching lib/ or
      # pubspec.yaml, which flutter create leaves alone when they exist.
      - name: Create the Android and iOS projects
        run: flutter create --platforms=ios,android --org com.nowssb --project-name nowssb .

      # android/ as generated does not build this app: the application id has
      # to be the one Firebase issued the config for, flutter_local_notifications
      # needs core library desugaring, firebase_auth needs minSdk 23, and the
      # google-services plugin is not applied by the FlutterFire packages.
      - name: Configure the Android project
        working-directory: .
        run: node tools/flutter-android.mjs

      - name: Install shared iOS branding
        working-directory: .
        run: node tools/flutter-ios.mjs

      - name: Dependencies
        run: flutter pub get

      # A build that compiles but is full of analyzer errors is not worth
      # downloading, so this runs first and the log says exactly what broke.
      # Infos never fail the APK. Warnings used to (unused leftover widgets),
      # which blocked every Flutter download for days. The player has to ship.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Fashion Plus widget tests have been red independently of the player.
      # They must not block the installable APK.
      - name: Test
        continue-on-error: true
        run: flutter test

      # Phones only: arm64 + 32-bit arm. The x86/x86_64 debug engines were
      # emulator-only weight in every download. Still one universal
      # app-debug.apk, which the publish step below relies on.
      # Sign this debug APK with the same stable key as the release update
      # when the secret is present. A fresh runner debug.keystore changes
      # the SHA every build and Google sign-in then reports the app as
      # unauthorised.
      - name: Write the stable signing key for this run
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No stable key; this debug APK keeps the runner debug keystore."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/nowssb.keystore
          cat > android/key.properties <<EOF
          storeFile=nowssb.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          keytool -list -v -keystore android/app/nowssb.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "SHA1:|SHA256:" || true

      - name: Build
        run: flutter build apk --debug --target-platform android-arm,android-arm64 --dart-define=NWSB_BUILD_NUMBER=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: nowssb-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # ── Update channel (main only) ───────────────────────────────────
      # The in-app updater and nowssb.com/download/flutter.apk get RELEASE
      # APKs, not the debug one above (which stays the Actions artifact):
      # the 529 MB debug APK carried two debug engines, a 100 MB JIT kernel
      # and a Vulkan validation layer on top of the ~390 MB of media. The
      # per-ABI release APK is what the updater downloads; the universal one
      # (both ABIs) is what the website hands out.
      #
      # SIGNING. A GitHub runner makes a fresh ~/.android/debug.keystore on
      # every run, so each debug build was signed by a different key and
      # Android refused to install one over another. The release APKs are
      # signed with the one stable key in ANDROID_KEYSTORE_BASE64 /
      # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      # (the same secrets the Play bundle job below uses). Without them the
      # update channel is not published at all, rather than published with
      # another throwaway key.
      - name: Check the update signing key
        id: updkey
        if: github.ref == 'refs/heads/main'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the release update APKs are not built or published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Written into the runner for this run only, after the debug APK is
      # built and uploaded. .gitignore refuses *.keystore and key.properties.
      - name: Write the update signing key
        if: steps.updkey.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/nowssb.keystore
          cat > android/key.properties <<EOF
          storeFile=nowssb.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Same sources and build number as the debug APK, release mode.
      # tools/flutter-android.mjs sets shrink=false (no R8, so plugins behave
      # as in the debug build) and keeps one versionCode across the per-ABI
      # and universal APKs, so either can replace the other.
      - name: Build release update APKs
        if: steps.updkey.outputs.ok == 'true'
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --dart-define=NWSB_BUILD_NUMBER=${{ github.run_number }}
          mkdir -p build/update-apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/update-apks/
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=NWSB_BUILD_NUMBER=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/update-apks/app-universal-release.apk
          rm -f android/app/nowssb.keystore android/key.properties
          ls -la build/update-apks

      # Flutter remains a separate native implementation, therefore it needs
      # its own stable direct APK and build manifest. The Android package id
      # is the same Firebase id, but the update prompt always sends a Flutter
      # install to the Flutter file—not to the WebView implementation.
      #
      # The per-ABI APKs carry the build number in their names, so a phone
      # resuming a half-finished download can never splice two different
      # builds together; the manifest also carries each file's size and
      # SHA-256, and goes up last. Per-ABI files older than the previous build
      # are deleted from the release.
      - name: Publish direct Flutter APK and update manifest
        if: steps.updkey.outputs.ok == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=nowssb-flutter-android
          BUILD=${GITHUB_RUN_NUMBER}
          DIR=flutter_app/build/update-apks
          PUBLIC_FILE=NowssB-Flutter-Android.apk
          ARM64_FILE=NowssB-Flutter-${BUILD}-arm64-v8a.apk
          ARM_FILE=NowssB-Flutter-${BUILD}-armeabi-v7a.apk
          UPDATE_FILE=NowssB-Flutter-update.json
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "NowssB Flutter Android" --notes "Latest direct NowssB Flutter Android APK. Download the APK itself, then install it from Android Downloads."
          fi
          cp "$DIR/app-universal-release.apk" "$PUBLIC_FILE"
          cp "$DIR/app-arm64-v8a-release.apk" "$ARM64_FILE"
          cp "$DIR/app-armeabi-v7a-release.apk" "$ARM_FILE"
          node tools/flutter-update-manifest.mjs --build "$BUILD" --repo "$GITHUB_REPOSITORY" --tag "$TAG" --out "$UPDATE_FILE" \
            --universal "$PUBLIC_FILE=$PUBLIC_FILE" \
            --apk "arm64-v8a=$ARM64_FILE=$ARM64_FILE" \
            --apk "armeabi-v7a=$ARM_FILE=$ARM_FILE"
          upload() {
            local file="$1"
            for attempt in 1 2 3; do
              echo "Uploading $file (attempt $attempt/3)"
              if timeout 300s gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
                return 0
              fi
              sleep 5
            done
            echo "Timed out or failed uploading $file after 3 attempts."
            return 1
          }
          upload "$ARM64_FILE"
          upload "$ARM_FILE"
          upload "$PUBLIC_FILE"
          upload "$UPDATE_FILE"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            | while read -r name; do
                n=$(printf '%s' "$name" | sed -n 's/^NowssB-Flutter-\([0-9][0-9]*\)-.*\.apk$/\1/p')
                if [ -n "$n" ] && [ "$n" -lt $((BUILD - 1)) ]; then
                  echo "Removing old $name"
                  gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes || true
                fi
              done

  release-bundle:
    name: Signed release bundle (Play)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check the signing secrets are set
        id: guard
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set — skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Same as the debug job: before pub get, or pub get fails on the
      # declared-but-missing assets/video/.
      - name: Bundle the clips and the shipped content
        if: steps.guard.outputs.ok == 'true'
        working-directory: .
        run: node tools/flutter-assets.mjs

      - name: Create the Android and iOS projects
        if: steps.guard.outputs.ok == 'true'
        run: flutter create --platforms=ios,android --org com.nowssb --project-name nowssb .

      - name: Configure the Android project
        if: steps.guard.outputs.ok == 'true'
        working-directory: .
        run: node tools/flutter-android.mjs

      - name: Install shared iOS branding
        if: steps.guard.outputs.ok == 'true'
        working-directory: .
        run: node tools/flutter-ios.mjs

      # Written into the runner for this run only. .gitignore already refuses
      # *.keystore, *.jks and key.properties, so it cannot reach the repo.
      - name: Write the signing material
        if: steps.guard.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/nowssb.keystore
          cat > android/key.properties <<EOF
          storeFile=nowssb.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Dependencies
        if: steps.guard.outputs.ok == 'true'
        run: flutter pub get

      - name: Build
        if: steps.guard.outputs.ok == 'true'
        # NWSB_PLAY_BUILD turns off the GitHub APK self-updater (Play policy).
        run: flutter build appbundle --release --dart-define=NWSB_PLAY_BUILD=true

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          name: nowssb-flutter-release-aab
          path: flutter_app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
