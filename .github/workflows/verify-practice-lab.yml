name: Verify NowssB Practice Lab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-practice-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format
        run: |
          dart format flutter_app/lib/screens/practice_player.dart flutter_app/lib/screens/practice_overlay.dart

      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze changed screens
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/practice_player.dart lib/screens/practice_overlay.dart

      - name: Create the Android project
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.nowssb --project-name nowssb .

      - name: Configure the Android project
        run: node tools/flutter-android.mjs

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug
