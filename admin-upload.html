<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NowssB — Audio Upload</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b12;color:#f6f2ea;padding:24px}main{max-width:720px;margin:auto}.card{background:rgba(20,29,42,.88);border:1px solid #ffffff22;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 18px 60px #0008}h1{font-size:24px;margin:0 0 6px}h2{font-size:16px;margin:0 0 16px;color:#e8d5a3}p{color:#ffffffa8;font-size:13px;line-height:1.5}label{display:block;font-size:11px;color:#ffffff99;letter-spacing:1px;text-transform:uppercase;margin:13px 0 6px}input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff2c;background:#ffffff0d;color:#fff;font:inherit}button{cursor:pointer;background:#e8d5a3;color:#111;font-weight:800;margin-top:16px}.hidden{display:none}.status{min-height:20px;margin-top:12px;font-size:13px;color:#9fe8d9}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cell{font-size:11px;text-align:center;padding:9px 3px;border:1px solid #ffffff18;border-radius:9px;background:#ffffff08;color:#ffffff66}.cell.done{color:#9fe8d9;border-color:#9fe8d955;background:#9fe8d911}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.signout{background:#ffffff12;color:#fff;margin-top:8px}.user{font-size:12px;color:#ffffff88}
  </style>
</head>
<body>
<main>
  <section class="card" id="authCard"><h1>NowssB Audio Studio</h1><p>Sign in with an administrator account to manage real reference recordings.</p><button id="signIn">Sign in with Google</button><div class="status" id="authStatus"></div></section>
  <section class="hidden" id="studio">
    <div class="card"><div class="row"><div><h1>Reference audio</h1><div class="user" id="userLabel"></div></div><button class="signout" id="signOut">Sign out</button></div><p>Upload one human reference recording for a word and one of its ten pace levels.</p><label for="word">Word ID</label><input id="word" placeholder="courage" autocomplete="off"><label for="title">Display title</label><input id="title" placeholder="COURAGE"><label for="meaning">Meaning</label><input id="meaning" placeholder="The strength to act despite fear."><div class="row"><div><label for="level">Level</label><select id="level"></select></div><div><label for="audio">MP3 recording</label><input id="audio" type="file" accept="audio/mpeg,audio/mp3,audio/*"></div></div><button id="upload">Upload recording</button><div class="status" id="uploadStatus"></div></div>
    <div class="card"><h2>Level coverage</h2><p>Green cells represent recordings already uploaded for the selected word.</p><div class="grid" id="coverage"></div></div>
  </section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyBly5XnqNnpVom11thjlvT5q_BfxNJBfgQ',authDomain:'nowssb-34f1b.firebaseapp.com',projectId:'nowssb-34f1b',storageBucket:'nowssb-34f1b.firebasestorage.app',messagingSenderId:'1024709686012',appId:'1:1024709686012:web:20d425060043141a0b5d79'},'audio-upload');
const auth=getAuth(app), db=getFirestore(app), $=id=>document.getElementById(id), levels=['Whisper','Slow','Gentle','Steady','Clear','Natural','Confident','Fluent','Sharp','Mastery'];
levels.forEach((name,i)=>$('level').insertAdjacentHTML('beforeend',`<option value="${i+1}">${i+1} — ${name}</option>`));
function status(text){$('uploadStatus').textContent=text} function authStatus(text){$('authStatus').textContent=text}
async function admin(user){return (await getDoc(doc(db,'admins',user.uid))).exists()}
async function coverage(){const id=$('word').value.trim().toLowerCase();$('coverage').innerHTML='';if(!id)return;const snap=await getDoc(doc(db,'words',id));const data=snap.exists()?snap.data():{};for(let i=1;i<=10;i++){const done=!!data.levels?.[i]?.audioUploaded;$('coverage').insertAdjacentHTML('beforeend',`<div class="cell ${done?'done':''}">${done?'✓':'○'}<br>${i}</div>`)}}
$('signIn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){authStatus(e.message)}};$('signOut').onclick=()=>signOut(auth);$('word').oninput=coverage;
$('upload').onclick=async()=>{const user=auth.currentUser,file=$('audio').files[0],id=$('word').value.trim().toLowerCase(),n=Number($('level').value);if(!user||!file||!/^[a-z0-9_-]+$/.test(id)){status('Enter a valid word ID and choose an audio file.');return}status('Uploading…');try{const token=await user.getIdToken();const form=new FormData();form.append('word',id);form.append('level',n);form.append('audio',file,file.name);const r=await fetch('/api/admin-audio',{method:'POST',headers:{Authorization:`Bearer ${token}`},body:form});const result=await r.json();if(!r.ok)throw new Error(result.error||'Upload failed');await setDoc(doc(db,'words',id),{id,title:$('title').value.trim()||id.toUpperCase(),meaning:$('meaning').value.trim(),levels:{[n]:{audioUploaded:true}}},{merge:true});status(`Uploaded level ${n} — ${levels[n-1]}.`);coverage()}catch(e){status(e.message)}};
onAuthStateChanged(auth,async user=>{if(!user){$('authCard').classList.remove('hidden');$('studio').classList.add('hidden');return}authStatus('Checking administrator access…');if(!await admin(user)){authStatus('This account is not listed in admins/<uid>.');await signOut(auth);return}$('authCard').classList.add('hidden');$('studio').classList.remove('hidden');$('userLabel').textContent=user.email||user.uid});
</script>
</body>
</html>
