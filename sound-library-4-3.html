<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sound Library</title>
<style>
  :root{
    --bg: #000000;
    --card-bg: rgba(255,255,255,0.035);
    --card-border: rgba(255,255,255,0.09);
    --text-primary: #f5f5f7;
    --text-secondary: rgba(235,235,245,0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    max-width: 620px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 18px 150px;
    background: #000;
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 10px;
    margin-bottom: 22px;
  }
  .title-block{ min-width:0; }
  .title-block h1{
    font-size: clamp(26px, 8vw, 34px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    line-height:1.05;
  }
  .title-block p{
    margin:0;
    color: var(--text-secondary);
    font-size: 14.5px;
  }
  .header-icons{
    display:flex;
    gap:10px;
    flex-shrink:0;
  }
  .icon-btn-img{
    width:46px; height:46px;
    border-radius:50%;
    display:block;
    cursor:pointer;
    flex-shrink:0;
    object-fit: cover;
    transition: transform .15s ease, filter .2s ease;
  }
  .icon-btn-img:active{ transform: scale(0.94); }
  .icon-btn-img:hover{ filter: brightness(1.15); }

  .tabs{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom: 14px;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor:pointer;
    white-space:nowrap;
    transition: all .2s ease;
  }
  .tab.active{
    color:#fff;
    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.6);
  }
  .tab-underline{
    height:2.5px;
    width:24px;
    border-radius: 2px;
    background: rgba(255,255,255,0.7);
    margin: 2px 0 20px 3px;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  .track{
    display:flex;
    align-items:center;
    gap:13px;
    padding: 11px;
    border-radius: 18px;
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015) 55%, rgba(255,255,255,0.03));
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    position: relative;
    overflow: hidden;
    cursor:pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -8px 16px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.35);
    transition: border-color .25s ease, background .25s ease, box-shadow .25s ease, padding .25s ease;
  }
  .track:active{ transform: scale(0.995); }

  .track.playing{
    border-color: rgba(255,255,255,0.3);
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02) 55%, rgba(255,255,255,0.045));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.1),
      inset 0 -8px 16px rgba(0,0,0,0.3),
      0 0 0 1px rgba(255,255,255,0.07),
      0 0 24px rgba(255,255,255,0.12);
    padding-bottom: 18px;
    align-items: flex-start;
  }

  .art{
    width: 54px; height: 54px;
    border-radius: 13px;
    flex-shrink:0;
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
    overflow:hidden;
  }
  .art svg{ position:absolute; inset:0; width:100%; height:100%; }

  .track-info{ flex: 1; min-width:0; }
  .track-info .name{
    font-size: 15.5px;
    font-weight: 600;
    margin: 0 0 3px;
    color: #fdfdfd;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-info .meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .mini-wave{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:11px;
    opacity:0.55;
  }
  .mini-wave span{
    width:2px;
    background: var(--text-secondary);
    border-radius:1px;
  }

  .waveform{
    display:none;
    align-items:center;
    gap:2.5px;
    height:20px;
    margin-top:8px;
    overflow:hidden;
    width:100%;
  }
  .track.playing .waveform{ display:flex; }
  .track.playing .meta{ display:none; }

  .waveform span{
    flex-shrink:0;
    width:3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.22);
    animation: wave 1.3s ease-in-out infinite;
  }
  .waveform span.done{ background: rgba(255,255,255,0.92); }

  @keyframes wave{
    0%, 100% { transform: scaleY(0.45); }
    50% { transform: scaleY(1); }
  }

  .right-col{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .track.playing .right-col{ margin-top: 1px; }

  .duration{
    font-size: 13.5px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* WHITE CIRCLE WRAPPER play button */
  .play-btn{
    width: 42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.03);
    border: 1.5px solid rgba(255,255,255,0.85);
    color:#fff;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .25s ease;
    flex-shrink: 0;
  }
  .play-btn:active{ transform: scale(0.92); }
  .play-btn svg{ width:14px; height:14px; }
  .play-btn svg.play-icon{ margin-left: 2px; }

  .track.playing .play-btn{
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 0 16px rgba(255,255,255,0.55);
  }

  .progress-track{
    position:absolute;
    left:11px; right:11px; bottom:9px;
    height:3px;
    border-radius:2px;
    background: rgba(255,255,255,0.10);
    overflow:hidden;
    display:none;
  }
  .track.playing .progress-track{ display:block; }
  .progress-fill{
    height:100%;
    width: 38%;
    border-radius:2px;
    background: #ffffff;
  }

  /* Bottom mini player - same glass treatment as track cards */
  .mini-player{
    position: fixed;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 596px;
    border-radius: 24px;
    padding: 10px 16px 14px;
    background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 55%, rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.12),
      inset 0 -8px 18px rgba(0,0,0,0.35),
      0 -6px 30px rgba(0,0,0,0.55), 0 0 24px rgba(255,255,255,0.06);
    z-index: 50;
  }
  .drag-handle{
    width: 36px; height:4px;
    border-radius:2px;
    background: rgba(255,255,255,0.25);
    margin: 0 auto 10px;
  }
  .mini-player-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mini-art{
    width:42px; height:42px;
    border-radius:12px;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.08);
    position:relative;
    overflow:hidden;
  }
  .mini-art svg{ position:absolute; inset:0; width:100%; height:100%; }
  .mini-info{ flex:1; min-width:0; }
  .mini-info .name{
    font-size:14.5px;
    font-weight:600;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .mini-info .time{
    font-size:12px;
    color: var(--text-secondary);
    margin-top:1px;
    font-variant-numeric: tabular-nums;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:18px;
    flex-shrink:0;
  }
  .ctrl-btn{
    background:none;
    border:none;
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0.85;
    padding:4px;
  }
  .ctrl-btn:active{ transform: scale(0.9); }
  .ctrl-btn svg{ width:17px; height:17px; }

  .mini-play{
    width:44px; height:44px;
    border-radius:50%;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 0 14px rgba(255,255,255,0.5);
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    flex-shrink:0;
  }
  .mini-play svg{ width:16px; height:16px; }

  @media (min-width: 720px){
    .app{ padding-top: 36px; }
  }
  @media (prefers-reduced-motion: reduce){
    .waveform span { animation: none !important; }
  }
.sound-library-43-grab{width:44px;height:4px;border-radius:99px;background:rgba(255,255,255,.72);margin:0 auto 10px;box-shadow:0 0 12px rgba(255,255,255,.25)}
</style>
</head>

<script>
  // Self-contained gradient + icon "art" for each track (no external images, so it always renders identically)
  function artSVG(grad, iconPath){
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">${grad}</linearGradient></defs>
      <rect width="100" height="100" fill="url(#g)"/>
      <g opacity="0.85" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round">${iconPath}</g>
    </svg>`;
  }

  const tracks = [
    { name:"Rain on Glass", cat:"Nature", dur:"42:18",
      art: artSVG('<stop offset="0%" stop-color="#3a3f47"/><stop offset="100%" stop-color="#0d0e10"/>',

  function miniWaveBars(){
    let h = [4,7,10,6,3];
    return h.map(v=>`<span style="height:${v}px"></span>`).join('');
  }

  function fullWaveBars(playedRatio){
    const total = 40;
    let out = '';
    for(let i=0;i<total;i++){
      const h = 5 + Math.round(Math.abs(Math.sin(i*0.7))*13 + (i%3)*1.5);
      const cls = i/total < playedRatio ? 'done' : '';
      const delay = (i*0.045).toFixed(2);
      out += `<span class="${cls}" style="height:${h}px; animation-delay:${delay}s"></span>`;
    }
    return out;
  }

  const list = document.getElementById('list');

  function playIcon(){
    return `<svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  }
  function pauseIcon(){
    return `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`;
  }

          <div class="meta">

            <span class="mini-wave">${miniWaveBars()}</span>
          </div>
          <div class="waveform">${fullWaveBars(0.34)}</div>
        </div>
        <div class="right-col">
          <div class="duration">${t.dur}</div>
          <div class="play-btn">
            ${t.playing ? pauseIcon() : playIcon()}

        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>
    `).join('');
  }

  render();

  list.addEventListener('click', (e)=>{
    const trackEl = e.target.closest('.track');
    if(!trackEl) return;
    const idx = parseInt(trackEl.dataset.index);
    tracks.forEach((t,i)=> t.playing = (i===idx) ? !t.playing : false);
    render();
    syncMiniPlayer();
  });

  document.getElementById('tabs').addEventListener('click', (e)=>{
    const tab = e.target.closest('.tab');
    if(!tab) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
  });

  const miniArt = document.getElementById('miniArt');
  const miniName = document.getElementById('miniName');
  const miniPlayIcon = document.getElementById('miniPlayIcon');
  const miniPlayBtn = document.getElementById('miniPlayBtn');

  function syncMiniPlayer(){
    const active = tracks.find(t=>t.playing) || tracks[1];
    miniArt.innerHTML = active.art;
    miniName.textContent = active.name;
    miniPlayIcon.innerHTML = active.playing ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>' : '<path d="M8 5v14l11-7z"/>';
  }
  syncMiniPlayer();

  miniPlayBtn.addEventListener('click', ()=>{
    const active = tracks.find(t=>t.playing);
    if(active){
      active.playing = !active.playing;
      render();
      syncMiniPlayer();
    }
  });
document.getElementById('soundLibrary43Back')?.addEventListener('click',function(){window.parent!==window ? window.parent.postMessage({type:'close-player-sheet'},'*') : location.replace('index.html?returnTo=player')});
document.getElementById('soundLibrary43Grab')?.addEventListener('touchend',function(e){if(this._y0-e.changedTouches[0].clientY>36) window.parent&&window.parent.lgpOpenSoundLibrary43&&window.parent.lgpOpenSoundLibrary43(this);});
document.getElementById('soundLibrary43Grab')?.addEventListener('touchstart',function(e){this._y0=e.touches[0].clientY},{passive:true});
</script>
</body>
