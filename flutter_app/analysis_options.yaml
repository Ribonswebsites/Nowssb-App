analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  # The app contains intentionally retained screen variants and scaffolding
  # while the Flutter surfaces are being completed. Keep these diagnostics
  # visible in IDEs without making CI fail on the stable SDK's stricter lint
  # defaults.
  errors:
    unused_element: ignore
    unused_element_parameter: ignore
    unused_import: ignore
    unused_local_variable: ignore
include: package:flutter_lints/flutter.yaml
linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
