name: nowssb
description: NowssB — Shabdapathy. Natural Origin of Word Science.
publish_to: 'none'
version: 9.5.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Content. Words, meanings, the library and the eBooks already live in
  # Firestore (content/words, content/meanings, content/library,
  # content/books) — see FLUTTER.md. There is no catalogue to port, and an
  # edit published from the studio reaches this app without a Play release.
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Notifications. The sending side needs nothing new: functions/api/push.js
  # already posts to FCM tokens as well as Web Push endpoints.
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  http: ^1.2.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  video_player: ^2.9.2
  flutter_tts: ^4.2.5
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    # Every clip and its poster, on the phone after the download.
    - assets/video/

    # The app's own artwork and Store intro-page paintings.
    - assets/frames/
    - assets/coach/
    - assets/icons/
    - assets/store/
    - assets/store/collections/
    - assets/fashion/
    - assets/player/
    - assets/signature/
    - assets/certificates/
    - assets/banners/
    - assets/media/
    - assets/content/

flutter_launcher_icons:
  android: false
  ios: true
  image_path: ../assets/icons/app-icon-512.png
