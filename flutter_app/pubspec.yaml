name: nowssb
description: NowssB — Shabdapathy. Natural Origin of Word Science.
publish_to: 'none'
version: 9.5.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Content. Words, meanings, the library and the eBooks already live in
  # Firestore (content/words, content/meanings, content/library,
  # content/books) — see FLUTTER.md. There is no catalogue to port, and an
  # edit published from the studio reaches this app without a Play release.
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_functions: ^5.1.3
  firebase_storage: ^12.3.4
  intl: ^0.19.0
  in_app_purchase: ^3.2.1
  # Google Play subscriptions (lib/data/play_subscriptions.dart): offer
  # tokens, upgrades, and sha256(uid) as the obfuscated account id.
  in_app_purchase_android: ^0.5.0
  crypto: ^3.0.3
  google_sign_in: ^6.2.1

  # Notifications. The sending side needs nothing new: functions/api/push.js
  # already posts to FCM tokens as well as Web Push endpoints.
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  video_player: ^2.9.2
  flutter_tts: ^4.2.5
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  record: ^5.2.1
  speech_to_text: ^7.4.0
  archive: ^3.6.1
  file_picker: ^8.1.4
  flutter_thinking_orbs: ^0.1.0
  sensors_plus: ^6.1.1
  # Admin mode (lib/admin): a word's own recording plays with just_audio and
  # is kept on the phone by flutter_cache_manager (also what caches template
  # pictures/clips replaced from the live template editor). Media lives on
  # Cloudflare R2 — see functions/api/admin/upload-url.js.
  just_audio: ^0.9.46
  flutter_cache_manager: ^3.4.1
  flutter_liquid_glass_plus: ^0.0.7
  liquid_glass_animation: ^0.0.1
  siri_orb: ^0.0.3

dependency_overrides:
  # record 5.2.1's broad Linux constraint otherwise resolves to 0.7.2,
  # which does not implement the current platform interface API on Flutter's
  # stable Linux host during Android/iOS builds.
  record_linux: 1.3.1
  # file_picker 8.x still compiles against API 34. Newer lifecycle AARs
  # demand 35/36 and fail checkDebugAarMetadata inside that plugin module.
  flutter_plugin_android_lifecycle: 2.0.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    # Every clip and its poster, on the phone after the download.
    - assets/video/
    - assets/videos/
    - assets/notifications/

    # The app's own artwork and Store intro-page paintings.
    - assets/frames/
    - assets/coach/
    - assets/icons/
    - assets/progress/
    - assets/store/
    - assets/meanings/
    - assets/ebooks/
    - assets/profile_source/
    - assets/routine/
    - assets/store/collections/
    - assets/store/store-rotator/
    - assets/fashion/
    - assets/player/
    - assets/player/guide/
    - assets/player/intro/
    - assets/signature/
    - assets/certificates/
    - assets/banners/
    - assets/banners/promo/
    - assets/banners/stories/
    - assets/banners/gyro/
    - assets/banners/earn/
    - assets/banners/programs/
    - assets/gifts/
    - assets/footer/
    - assets/login/
    - assets/media/
    - assets/content/
    - assets/subscription/
    - assets/hero-curve/
    - assets/flip_brand/

flutter_launcher_icons:
  android: false
  ios: true
  image_path: ../assets/icons/app-icon-512.png
