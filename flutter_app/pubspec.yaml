name: nowssb
description: NowssB — Shabdapathy. Natural Origin of Word Science.
publish_to: 'none'
version: 9.6.41+39

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Content. Words, meanings, the library and the eBooks already live in
  # Firestore (content/words, content/meanings, content/library,
  # content/books) — see FLUTTER.md. There is no catalogue to port, and an
  # edit published from the studio reaches this app without a Play release.
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  flutter_webrtc: ^1.6.0

  # Notifications. The sending side needs nothing new: functions/api/push.js
  # already posts to FCM tokens as well as Web Push endpoints.
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  shared_preferences: ^2.3.2
  http: ^1.2.2
  http_parser: ^4.0.2
  path_provider: ^2.1.4
  record: ^7.1.1
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # test/fake_video_platform.dart stands in for ExoPlayer so the video pool's
  # ceiling can be tested against real controllers rather than mocks.
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    # Curated home/player clips and their posters, matching the compact
    # 25 August native bundle. The generated remote media catalog stays out
    # of the APK so the package remains near 200 MB.
    #
    # The posters are not decoration: off-screen clips show them, on-screen
    # clips play (see lib/media/video_pool.dart). Every poster is the clip's
    # own first frame, so a wait never looks like a different picture.
    - assets/video/

    # Small app artwork required by the native shell and bundled sections.
    - assets/frames/
    - assets/icons/
    - assets/store/
    - assets/fashion/
    - assets/player/
    - assets/signature/
    - assets/certificates/

    # Small local content fallback; Firestore overrides it at runtime.
    - assets/content/
