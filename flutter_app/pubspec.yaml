name: nowssb
description: NowssB — Shabdapathy. Natural Origin of Word Science.
publish_to: 'none'
version: 9.5.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Content. Words, meanings, the library and the eBooks already live in
  # Firestore (content/words, content/meanings, content/library,
  # content/books) — see FLUTTER.md. There is no catalogue to port, and an
  # edit published from the studio reaches this app without a Play release.
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Notifications. The sending side needs nothing new: functions/api/push.js
  # already posts to FCM tokens as well as Web Push endpoints.
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2

  # The app's marks are DRAWN — every icon in index.html is an inline SVG
  # path, not a picture. This is what lets those paths be pasted in verbatim
  # instead of a Material glyph being picked to look roughly like one.
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # test/fake_video_platform.dart stands in for ExoPlayer so the video pool's
  # ceiling can be tested against real controllers rather than mocks.
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    # Every clip and its poster, on the phone after the download — no
    # network, no Cloudinary, no buffering. 35 mp4 and 35 -poster.webp.
    #
    # The posters are not decoration: at most four clips decode at once
    # (see lib/media/video_pool.dart), so most of these are showing their
    # poster at any moment and the app looks right only because that
    # poster is the clip's own first frame.
    - assets/video/

    # The app's own artwork, all of it already in this repository. The
    # device bezels the televisions are drawn from, the intro-page
    # paintings, the logo disc, the collection banners.
    - assets/frames/
    - assets/icons/
    - assets/store/
    - assets/store/collections/
    - assets/fashion/
    - assets/player/
    - assets/signature/
    - assets/certificates/
    - assets/banners/

    # Downloaded remote media, when it exists. Declared with a trailing
    # slash so an empty or absent folder is not a pub get failure.
    - assets/media/

    # What ships, so no screen is ever empty on first launch or offline.
    # Generated by tools/export-content.mjs from the same declarations the
    # website uses; Firestore overrides all of it at runtime.
    - assets/content/
